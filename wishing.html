<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#10251f">
    <title>许愿井 · 旅途传说</title>
<script src="device-ui.js?v=16"></script>
<link rel="stylesheet" href="device-ui.css?v=16">
    <style>
        :root{color-scheme:dark;--ink:#fff7e8;--muted:#a9bdb2;--line:rgba(226,207,155,.18);--gold:#dfc477;--moss:#183c31;--deep:#081510;--danger:#da7666;--panel:rgba(10,28,22,.82)}
        *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 25%,rgba(64,132,101,.3),transparent 30%),radial-gradient(circle at 12% 0,rgba(223,196,119,.12),transparent 25%),linear-gradient(145deg,#07110d,#10251f 56%,#050b08);overflow-x:hidden}button,input{font:inherit}.mist{position:fixed;inset:0;pointer-events:none;background:repeating-radial-gradient(ellipse at 50% 65%,transparent 0 42px,rgba(211,238,220,.025) 43px 44px);mask-image:linear-gradient(to bottom,transparent 8%,#000 70%)}
        .topbar{position:relative;z-index:3;width:min(1160px,calc(100% - 28px));margin:16px auto 0;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 18px;border:1px solid var(--line);border-radius:8px;background:rgba(6,18,13,.78);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:900}.brand img{width:38px;height:38px;border-radius:6px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{min-height:38px;display:grid;place-items:center;padding:0 12px;border:1px solid transparent;border-radius:6px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:800}.nav a:hover,.nav a.is-current{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.06)}
        .page{position:relative;z-index:1;width:min(1040px,calc(100% - 28px));margin:auto;padding:58px 0 70px}.hero{text-align:center}.eyebrow{color:var(--gold);font:800 11px Georgia,serif;letter-spacing:.24em}.hero h1{margin:12px 0 9px;font:900 clamp(48px,8vw,86px)/1 "STKaiti","KaiTi",serif}.hero p{max-width:600px;margin:auto;color:var(--muted);font-size:13px;line-height:1.9}.well{position:relative;width:170px;height:114px;margin:35px auto 42px;border:9px solid #476457;border-bottom-width:20px;border-radius:50%;background:radial-gradient(ellipse,#07140f 24%,#0d3328 58%,#5a7868 62%,#243c31 69%);box-shadow:0 26px 70px rgba(0,0,0,.38),inset 0 0 30px rgba(105,202,159,.22)}.well::after{content:"";position:absolute;left:50%;bottom:-48px;width:116px;height:45px;transform:translateX(-50%);border-radius:0 0 18px 18px;background:linear-gradient(90deg,#293e34,#5d7869,#263a31);clip-path:polygon(13% 0,87% 0,100% 100%,0 100%)}.well-glow{position:absolute;left:50%;top:42%;width:72px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:#88dfba;filter:blur(11px);opacity:.5;animation:pulse 3s ease-in-out infinite}
        .console{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}.panel{min-width:0;padding:20px;border:1px solid var(--line);border-radius:7px;background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.2);backdrop-filter:blur(14px)}.status-card h2,.offering h2{margin:0;font-size:18px}.usage{margin-top:20px;padding:17px;border:1px solid rgba(223,196,119,.25);border-radius:6px;background:rgba(223,196,119,.06)}.usage strong{display:block;color:var(--gold);font:900 38px Georgia,serif}.usage span{color:var(--muted);font-size:11px}.rule-list{display:grid;gap:10px;margin-top:18px}.rule{display:grid;grid-template-columns:24px 1fr;gap:9px;color:var(--muted);font-size:11px;line-height:1.6}.rule b{color:var(--ink)}.rule-index{color:var(--gold);font:700 10px Georgia,serif}
        .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:17px 0}.mode{min-height:44px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:rgba(255,255,255,.03);cursor:pointer;font-weight:900}.mode.active{border-color:rgba(223,196,119,.5);color:#182018;background:var(--gold)}.pane[hidden]{display:none}.gold-box{display:grid;grid-template-columns:1fr auto;gap:9px}.gold-box input{min-width:0;height:48px;padding:0 13px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:rgba(0,0,0,.2);outline:0}.wallet{display:grid;align-content:center;padding:0 13px;border:1px solid var(--line);border-radius:5px;color:var(--gold);font-size:12px}.item-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;max-height:260px;overflow:auto;padding:2px}.item-slot{position:relative;aspect-ratio:1;min-width:0;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:rgba(255,255,255,.035);cursor:pointer}.item-slot:hover,.item-slot.selected{border-color:var(--gold);background:rgba(223,196,119,.11);box-shadow:inset 0 0 0 1px rgba(223,196,119,.2)}.item-slot .icon{display:block;font-size:24px}.item-slot .count{position:absolute;right:4px;bottom:3px;color:var(--muted);font-size:9px}.empty{grid-column:1/-1;padding:30px;color:var(--muted);text-align:center;font-size:12px}.selection{min-height:36px;margin-top:10px;color:var(--muted);font-size:11px}.wish-button{width:100%;min-height:52px;margin-top:14px;border:0;border-radius:5px;color:#172018;background:linear-gradient(135deg,#dfc477,#aa8b47);cursor:pointer;font-weight:900}.wish-button:disabled{opacity:.48;cursor:wait}.warning{margin-top:10px;color:#d3b9a1;font-size:10px;text-align:center}
        .well-history{margin-top:14px}.well-history-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:13px}.well-history-head h2{margin:0;font-size:18px}.well-history-head span{color:var(--muted);font-size:10px}.history-list{display:grid;gap:7px}.history-row{display:grid;grid-template-columns:minmax(110px,.8fr) minmax(150px,1.2fr) auto auto;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:5px;background:rgba(255,255,255,.025);font-size:11px}.history-user{font-weight:900}.history-offering,.history-time{color:var(--muted)}.history-result{padding:5px 8px;border-radius:999px;font-weight:900}.history-result.success{color:#9ce0b7;background:rgba(75,153,108,.18)}.history-result.failed{color:#efaaa0;background:rgba(170,72,62,.18)}
        .overlay{position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:18px;background:rgba(3,9,6,.75);backdrop-filter:blur(9px)}.overlay[hidden]{display:none}.result{width:min(440px,100%);padding:28px;border:1px solid var(--line);border-radius:8px;text-align:center;background:#0c2119;box-shadow:0 30px 100px rgba(0,0,0,.5)}.result-mark{width:90px;height:90px;margin:auto;display:grid;place-items:center;border:1px solid rgba(223,196,119,.34);border-radius:50%;color:var(--gold);font:900 40px Georgia,serif;background:rgba(223,196,119,.08)}.result h2{margin:18px 0 8px;font:900 29px "STKaiti","KaiTi",serif}.result p{color:var(--muted);line-height:1.8}.close{min-height:42px;padding:0 18px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:rgba(255,255,255,.06);cursor:pointer}.toast{position:fixed;z-index:100;left:50%;top:18px;transform:translateX(-50%);padding:11px 15px;border:1px solid var(--line);border-radius:5px;background:#102b21;box-shadow:0 12px 40px rgba(0,0,0,.4)}
        @keyframes pulse{50%{opacity:.8;transform:translate(-50%,-50%) scale(1.2)}}
        @media(max-width:760px){.topbar{margin-top:8px;padding:10px}.brand span{display:none}.nav{flex:1;overflow-x:auto;flex-wrap:nowrap}.nav a{white-space:nowrap}.page{padding-top:38px}.well{margin-top:25px}.console{grid-template-columns:1fr}.item-grid{grid-template-columns:repeat(5,minmax(0,1fr));max-height:290px}.panel{padding:16px}.history-row{grid-template-columns:1fr auto}.history-offering,.history-time{grid-column:1/-1}}
    </style>
</head>
<body>
<div class="mist" aria-hidden="true"></div>
<header class="topbar"><a class="brand" href="index.html"><img src="logo.png" alt=""><span>旅途传说 · 林间许愿井</span></a><nav class="nav"><a href="bagdemo.html">背包</a><a href="wishing.html">许愿井</a><a href="contacts.html">联络人</a><a href="lottery.html">抽奖</a><a href="market.html">市场</a></nav></header>
<main class="page">
    <section class="hero"><span class="eyebrow">THE WELL REMEMBERS</span><h1>林间许愿井</h1><p>把一份拥有交给井底。它也许从此沉默，也许沿着回声变成两份归来。</p><div class="well" aria-hidden="true"><span class="well-glow"></span></div></section>
    <section class="console">
        <aside class="panel status-card"><h2>今日回声</h2><div class="usage"><strong id="usesLeft">—</strong><span>剩余许愿次数 · 每日共 3 次</span></div><div class="rule-list"><div class="rule"><span class="rule-index">01</span><span><b>一次一份</b><br>物品每次固定投入 1 件，金币可自行填写数量。</span></div><div class="rule"><span class="rule-index">02</span><span><b>各半命运</b><br>50% 永久消失，50% 返还投入数量的两倍。</span></div><div class="rule"><span class="rule-index">03</span><span><b>云端裁定</b><br>扣除与结果由服务器一次完成，关闭页面也不会回滚。</span></div></div></aside>
        <section class="panel offering"><h2>选择投入</h2><div class="mode-tabs"><button class="mode active" type="button" data-mode="gold">金币</button><button class="mode" type="button" data-mode="item">背包物品</button></div><div class="pane" id="goldPane"><div class="gold-box"><input id="goldAmount" type="number" min="1" max="1000000000" value="10" inputmode="numeric" aria-label="投入金币数量"><span class="wallet" id="walletGold">金币 —</span></div></div><div class="pane" id="itemPane" hidden><div class="item-grid" id="itemGrid"></div><div class="selection" id="itemSelection">请选择一件背包物品</div></div><button class="wish-button" id="wishButton" type="button">投入许愿井</button><p class="warning">投入后无法撤销，请确认数量和物品。</p></section>
    </section>
    <section class="panel well-history"><div class="well-history-head"><h2>最近的井中回声</h2><span>最近 10 条许愿记录</span></div><div class="history-list" id="historyList"><div class="empty">井边暂时没有新的回声</div></div></section>
</main>
<section class="overlay" id="resultOverlay" hidden><div class="result"><div class="result-mark" id="resultMark">?</div><h2 id="resultTitle">井底传来回声</h2><p id="resultCopy"></p><button class="close" id="closeResult" type="button">收下结果</button></div></section>
<div id="toastRegion" aria-live="polite"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let user=null,status=null,mode='gold',selectedSlot=-1,busy=false;
function toast(message){const node=document.createElement('div');node.className='toast';node.textContent=message;$('toastRegion').append(node);setTimeout(()=>node.remove(),3200)}
async function api(action,{method='GET',data={}}={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),5000);try{let url=`board.php?action=${encodeURIComponent(action)}`;const init={method,cache:'no-store',signal:controller.signal};if(method==='POST'){init.body=new URLSearchParams(Object.assign({action},data));init.headers={'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'};url='board.php'}const response=await fetch(url,init);const payload=await response.json().catch(()=>({code:'invalid_response'}));if(!response.ok&&payload.code!=='rate_limited')throw Object.assign(new Error(payload.code||'request_failed'),{payload});return payload}finally{clearTimeout(timer)}}
function renderAvatarItem(entry){const button=document.createElement('button');button.type='button';button.className='item-slot';button.title=`${entry.item.name} ×${entry.count}`;button.dataset.slot=entry.slotIndex;const icon=document.createElement('span');icon.className='icon';icon.textContent=entry.item.icon||'◇';const count=document.createElement('span');count.className='count';count.textContent=`×${entry.count}`;button.append(icon,count);button.addEventListener('click',()=>{selectedSlot=Number(entry.slotIndex);document.querySelectorAll('.item-slot').forEach(node=>node.classList.toggle('selected',Number(node.dataset.slot)===selectedSlot));$('itemSelection').textContent=`已选择：${entry.item.name} · 投入 1 件`});return button}
function render(){if(!status)return;$('usesLeft').textContent=String(status.left);$('walletGold').textContent=status.unlimitedGold?'金币 ∞':`金币 ${Number(status.gold||0).toLocaleString('zh-CN')}`;const grid=$('itemGrid');grid.replaceChildren();const items=Array.isArray(status.inventory)?status.inventory:[];if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='背包里暂时没有可投入的物品';grid.append(empty)}else items.forEach(entry=>grid.append(renderAvatarItem(entry)));selectedSlot=-1;$('itemSelection').textContent='请选择一件背包物品';$('wishButton').disabled=status.left<=0;$('wishButton').textContent=status.left<=0?'今日许愿次数已用完':'投入许愿井';renderHistory(status.history)}
function renderHistory(history){const list=$('historyList');list.replaceChildren();const rows=Array.isArray(history)?history.slice(0,10):[];if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='井边暂时没有新的回声';list.append(empty);return}rows.forEach(entry=>{const row=document.createElement('article');row.className='history-row';const user=document.createElement('strong');user.className='history-user';user.textContent=entry.user||'未知旅人';const offering=document.createElement('span');offering.className='history-offering';offering.textContent=`投入 ${entry.offering||'一份供品'}`;const time=document.createElement('time');time.className='history-time';time.textContent=entry.createdAt||'';const result=document.createElement('span');result.className=`history-result ${entry.success?'success':'failed'}`;result.textContent=entry.success?'许愿成功':'许愿失败';row.append(user,offering,time,result);list.append(row)})}
function setMode(next){mode=next;document.querySelectorAll('.mode').forEach(button=>button.classList.toggle('active',button.dataset.mode===mode));$('goldPane').hidden=mode!=='gold';$('itemPane').hidden=mode!=='item'}
function showResult(data){const doubled=data.result==='doubled';$('resultMark').textContent=doubled?'×2':'0';$('resultTitle').textContent=doubled?'愿望得到了回应':'投入沉入了井底';if(data.offering.kind==='gold')$('resultCopy').textContent=doubled?`${data.offering.amount} 金币变成了 ${data.rewardAmount} 金币。`:`${data.offering.amount} 金币消失在井底。`;else $('resultCopy').textContent=doubled?`「${data.offering.item.name}」变成了 2 件并已送回。`:`「${data.offering.item.name}」没有回来。`;$('resultOverlay').hidden=false}
async function load(){const data=await api('getWishingWellStatus');if(data.code!=='ok')throw new Error(data.code);status=data;render()}
async function wish(){if(busy||!status||status.left<=0)return;const payload={kind:mode};if(mode==='gold'){const amount=Math.floor(Number($('goldAmount').value||0));if(amount<1)return toast('请输入正确的金币数量');if(!status.unlimitedGold&&amount>Number(status.gold||0))return toast('金币不足');payload.amount=String(amount)}else{if(selectedSlot<0)return toast('请先选择一件背包物品');payload.slotIndex=String(selectedSlot)}busy=true;$('wishButton').disabled=true;$('wishButton').textContent='等待井底回应...';try{const data=await api('useWishingWell',{method:'POST',data:payload});const messages={daily_limit:'今天的 3 次机会已经用完',not_enough_gold:'金币不足',item_not_found:'这件物品已经不在背包中',unlimited_gold:'无限金币账号不能投入金币',rate_limited:'请稍等片刻再许愿'};if(data.code!=='ok')return toast(messages[data.code]||'许愿失败，请稍后重试');status=Object.assign({},status,{uses:data.uses,left:data.left,gold:data.gold,inventory:data.inventory,history:data.history});render();showResult(data)}catch(error){toast('许愿井暂时没有回应，请稍后重试')}finally{busy=false;render()}}
document.querySelectorAll('.mode').forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.mode)));$('wishButton').addEventListener('click',wish);$('closeResult').addEventListener('click',()=>{$('resultOverlay').hidden=true});$('resultOverlay').addEventListener('click',event=>{if(event.target===$('resultOverlay'))$('resultOverlay').hidden=true});window.addEventListener('keydown',event=>{if(event.key==='Escape')$('resultOverlay').hidden=true});
(async()=>{const auth=await JourneyAuth.ready;if(!auth||!auth.authenticated){location.href='auth.html?next=wishing.html';return}user=auth.user;load().catch(()=>toast('许愿井状态读取失败'))})();
})();
</script>
</body>
</html>
