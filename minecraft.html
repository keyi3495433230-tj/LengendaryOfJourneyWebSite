<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="device-ui.js?v=16"></script>
<link rel="stylesheet" href="device-ui.css?v=16">
    <title>我的世界服务器 - 乔治可翼</title>
    <style>
        :root {
            --bg: #eef6ed;
            --card: #fbfff9;
            --ink: #182318;
            --muted: #62705f;
            --line: rgba(42, 83, 48, 0.14);
            --green: #3f7d4f;
            --green-dark: #1f4c31;
            --gold: #c49b54;
            --shadow: 0 18px 44px rgba(31, 76, 49, 0.13);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 18% 10%, rgba(102, 171, 93, 0.24), transparent 30%),
                radial-gradient(circle at 82% 18%, rgba(196, 155, 84, 0.18), transparent 26%),
                linear-gradient(135deg, #fbfff8 0%, var(--bg) 58%, #d9ead6 100%);
        }

        header {
            width: min(980px, calc(100% - 32px));
            margin: 18px auto 0;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(251, 255, 249, 0.82);
            box-shadow: 0 8px 22px rgba(31, 76, 49, 0.08);
        }

        .brand {
            font-weight: 900;
            color: var(--green-dark);
        }

        nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        a,
        button {
            font: inherit;
        }

        nav a {
            color: var(--green-dark);
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.58);
            border: 1px solid var(--line);
            font-size: 14px;
            font-weight: 700;
        }

        main {
            width: min(980px, calc(100% - 32px));
            margin: 18px auto 40px;
            display: grid;
            gap: 18px;
        }

        .hero,
        .card {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(251, 255, 249, 0.86);
            box-shadow: var(--shadow);
        }

        .hero {
            padding: clamp(28px, 5vw, 54px);
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 24px;
            align-items: center;
        }

        .eyebrow {
            width: fit-content;
            padding: 7px 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.62);
            font-size: 13px;
            font-weight: 800;
        }

        h1 {
            margin-top: 18px;
            font-size: clamp(38px, 7vw, 70px);
            line-height: 1;
            color: var(--green-dark);
            letter-spacing: 0;
        }

        .desc {
            margin-top: 16px;
            color: var(--muted);
            line-height: 1.8;
            font-size: 16px;
        }

        .server-box {
            padding: 22px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #fff;
        }

        .label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
        }

        .ip {
            margin-top: 8px;
            font-size: clamp(25px, 4vw, 38px);
            font-weight: 900;
            color: var(--green-dark);
            word-break: break-all;
        }

        .copy {
            width: 100%;
            margin-top: 16px;
            min-height: 46px;
            border: none;
            border-radius: 8px;
            color: #fff;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            cursor: pointer;
            font-weight: 900;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .card {
            padding: 22px;
        }

        .card h2 {
            font-size: 19px;
            color: var(--green-dark);
            margin-bottom: 10px;
        }

        .card p {
            color: var(--muted);
            line-height: 1.7;
            font-size: 14px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 16px;
            border-radius: 8px;
            color: var(--green-dark);
            text-decoration: none;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.7);
            font-weight: 900;
        }

        .action.primary {
            color: #fff;
            border: none;
            background: linear-gradient(135deg, var(--green), var(--green-dark));
        }

        @media (max-width: 760px) {
            header,
            .hero {
                grid-template-columns: 1fr;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
            }

            nav {
                justify-content: flex-start;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">乔治可翼 · 服务器</div>
        <nav>
            <a href="index.html">首页</a>
            <a href="game.html">游戏官网</a>
            <a href="forum.html">论坛</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div>
                <div class="eyebrow">Minecraft 生存服务器</div>
                <h1>我的世界服务器</h1>
                <p class="desc">
                    轻量、直接、方便复制地址。这个页面不加载外部图片和复杂动画，打开速度优先。
                </p>
            </div>

            <div class="server-box">
                <div class="label">主服务器地址</div>
                <div class="ip" id="mainIp">georgehive.fun</div>
                <button class="copy" type="button" onclick="copyText('georgehive.fun', this)">复制服务器地址</button>
            </div>
        </section>

        <section class="grid">
            <div class="card">
                <h2>备用地址</h2>
                <p id="backupIp">mc5.yldw.net:50035</p>
                <button class="copy" type="button" onclick="copyText('mc5.yldw.net:50035', this)">复制备用地址</button>
            </div>
            <div class="card">
                <h2>推荐版本</h2>
                <p>进入前请使用服务器当前推荐版本。若无法连接，优先尝试备用地址。</p>
            </div>
            <div class="card">
                <h2>社区入口</h2>
                <p>服务器相关交流可以进入玩家论坛，后续公告也可以放在论坛里。</p>
            </div>
        </section>

        <div class="actions">
            <a class="action primary" href="forum.html">进入玩家论坛</a>
            <a class="action" href="game.html">返回游戏官网</a>
        </div>
    </main>

    <script>
        async function copyText(text, button) {
            try {
                await navigator.clipboard.writeText(text);
                const old = button.textContent;
                button.textContent = '已复制';
                setTimeout(() => button.textContent = old, 1200);
            } catch (e) {
                prompt('复制失败，请手动复制：', text);
            }
        }
    </script>
</body>
</html>
