<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>游戏世界暂停开放 · 旅途传说</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f0f2e;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #0f0f2e;
        }
        #game-container[hidden] { display: none !important; }
        #game-canvas {
            display: block;
            image-rendering: auto;
            touch-action: none;
            -webkit-touch-callout: none;
            position: relative;
            z-index: 1;
        }
        input[type="text"] {
            -webkit-appearance: none;
            appearance: none;
            font-size: 16px !important;
            touch-action: auto !important;
        }
        ::-webkit-scrollbar { display: none; }

        /* ========== 游戏内背包（DOM，和网页背包完全一致） ========== */
        #gameBagUI {
            position: absolute;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            pointer-events: auto;
        }
        #gameBagUI.visible { display: flex; }
        .bag-panel {
            background: #1d1513;
            border: 1px solid rgba(199,154,85,.28);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 22px 60px rgba(0,0,0,.6);
        }
        .bag-title {
            color: #fff4df;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(199,154,85,.16);
            position: relative;
        }
        .bag-close-btn {
            position: absolute;
            right: 0;
            top: 0;
            width: 24px;
            height: 24px;
            border: none;
            background: rgba(255,107,107,.2);
            color: #ff6b6b;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            display: grid;
            place-items: center;
        }
        .bag-close-btn:hover {
            background: rgba(255,107,107,.4);
        }
        .bag-grid {
            display: grid;
            grid-template-columns: repeat(7, 60px);
            gap: 8px;
        }
        .slot {
            position: relative;
            width: 60px;
            height: 60px;
            border: 1px solid rgba(199,154,85,.28);
            border-radius: 6px;
            background: rgba(255,255,255,.055);
            cursor: grab;
            transition: all .15s ease;
            display: grid;
            place-items: center;
            user-select: none;
        }
        .slot:hover {
            transform: translateY(-1px);
            border-color: rgba(199,154,85,.6);
            background: rgba(255,255,255,.1);
            z-index: 10;
        }
        .slot:active { cursor: grabbing; }
        .slot.empty { cursor: default; opacity: .6; }
        .slot.drag-over {
            outline: 2px solid #c79a55;
            outline-offset: -2px;
            background: rgba(199,154,85,.16);
        }
        .slot.dragging { opacity: .4; }
        .slot-icon {
            font-size: 30px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,.4));
            transform: translateY(-3px);
            pointer-events: none;
        }
        .slot-count {
            position: absolute;
            right: 4px;
            bottom: 4px;
            min-width: 18px;
            padding: 1px 4px;
            border-radius: 99px;
            background: rgba(12,8,8,.8);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
        }
        .slot-index {
            position: absolute;
            top: 4px;
            left: 5px;
            color: rgba(255,250,242,.3);
            font-size: 10px;
            pointer-events: none;
        }
        .slot-tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            width: 220px;
            padding: 10px;
            border: 1px solid rgba(199,154,85,.4);
            border-radius: 8px;
            background: rgba(20,12,10,.98);
            box-shadow: 0 12px 30px rgba(0,0,0,.5);
            color: rgba(255,250,242,.7);
            font-size: 12px;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity .12s ease, transform .12s ease;
            line-height: 1.5;
        }
        .slot:hover .slot-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .slot-tooltip strong {
            display: block;
            color: #fff4df;
            margin-bottom: 4px;
            font-size: 13px;
        }
        .slot-tooltip small {
            color: #c79a55;
            font-size: 11px;
        }

        /* 品质颜色 */
        .quality-common { border-color: rgba(190,196,202,.42); }
        .quality-uncommon { border-color: rgba(72,199,116,.56); background: rgba(72,199,116,.08); }
        .quality-rare { border-color: rgba(78,158,255,.62); background: rgba(78,158,255,.09); }
        .quality-epic { border-color: rgba(184,104,255,.68); background: rgba(184,104,255,.1); }
        .quality-legendary { border-color: rgba(151,31,43,.92); background: rgba(111,17,27,.18); }

        .quality-common .slot-tooltip strong { color: #c6cbd1; }
        .quality-uncommon .slot-tooltip strong { color: #5ed184; }
        .quality-rare .slot-tooltip strong { color: #63a8ff; }
        .quality-epic .slot-tooltip strong { color: #c07aff; }
        .quality-legendary .slot-tooltip strong { color: #ff6b7a; }

        /* ========== 快捷栏 ========== */
        #gameHotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 900;
            pointer-events: auto;
        }
        .hotbar-grid {
            display: grid;
            grid-template-columns: repeat(7, 52px);
            gap: 6px;
        }
        .hotbar-grid .slot {
            width: 52px;
            height: 52px;
            background: rgba(0,0,0,.6);
        }
        .hotbar-grid .slot.selected {
            outline: 3px solid #ffd93d;
            outline-offset: -2px;
        }
        .hotbar-key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: rgba(255,255,255,.4);
            pointer-events: none;
        }
        .mobile-game-tabs {
            position: absolute;
            left: 50%;
            bottom: max(0px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 1200;
            display: flex;
            width: min(360px, calc(100vw - 20px));
            padding: 6px;
            gap: 6px;
            border: 1px solid rgba(199,154,85,.35);
            border-radius: 12px 12px 0 0;
            background: rgba(22,15,14,.96);
            box-shadow: 0 -6px 22px rgba(0,0,0,.35);
            pointer-events: auto;
        }
        .mobile-game-tabs button {
            flex: 1;
            min-height: 44px;
            border: 1px solid rgba(199,154,85,.28);
            border-radius: 8px;
            background: rgba(255,255,255,.06);
            color: #fff4df;
            font: 700 15px/1 'Microsoft YaHei', sans-serif;
            touch-action: manipulation;
        }
        .mobile-game-tabs button.active {
            border-color: #c79a55;
            background: rgba(199,154,85,.18);
        }
        .mobile-item-actions {
            position: absolute;
            left: 50%;
            bottom: max(62px, calc(env(safe-area-inset-bottom) + 62px));
            transform: translate(-50%, 18px);
            z-index: 1500;
            display: none;
            width: min(420px, calc(100vw - 24px));
            padding: 14px;
            border: 1px solid rgba(199,154,85,.45);
            border-radius: 12px;
            background: rgba(24,16,14,.98);
            box-shadow: 0 14px 40px rgba(0,0,0,.55);
            pointer-events: auto;
        }
        .mobile-item-actions.visible { display: block; transform: translate(-50%, 0); }
        .mobile-item-action-name {
            margin-bottom: 10px;
            color: #fff4df;
            font: 700 15px/1.4 'Microsoft YaHei', sans-serif;
            text-align: center;
        }
        .mobile-item-action-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .mobile-item-action-buttons button {
            min-height: 44px;
            border: 1px solid rgba(199,154,85,.35);
            border-radius: 8px;
            background: rgba(199,154,85,.12);
            color: #fff4df;
            font: 700 13px/1.2 'Microsoft YaHei', sans-serif;
        }
        .mobile-item-action-buttons button.danger { color: #ff7886; border-color: rgba(255,95,112,.45); }

        @media (max-width: 900px), (pointer: coarse) {
            #gameHotbar { bottom: max(68px, calc(env(safe-area-inset-bottom) + 68px)); }
            .hotbar-grid { grid-template-columns: repeat(7, min(11vw, 46px)); gap: 4px; }
            .hotbar-grid .slot { width: min(11vw, 46px); height: min(11vw, 46px); }
            .hotbar-grid .slot-icon { font-size: 24px; }
            #gameBagUI { width: 100%; }
            .bag-panel {
                box-sizing: border-box;
                width: min(440px, calc(100vw - 20px));
                max-height: calc(100vh - 150px);
                overflow-y: auto;
                padding: 12px;
            }
            .bag-grid { grid-template-columns: repeat(3, minmax(64px, 1fr)); gap: 7px; }
            .bag-grid .slot { box-sizing: border-box; width: 100%; height: min(20vw, 76px); }
            .slot-tooltip { display: none; }
        }
        .game-maintenance {
            width: min(560px, calc(100vw - 32px));
            padding: clamp(28px, 6vw, 52px);
            border: 1px solid rgba(199,154,85,.38);
            border-radius: 12px;
            color: #fff4df;
            background: radial-gradient(circle at 50% 0, rgba(199,154,85,.13), transparent 38%), #171311;
            box-shadow: 0 28px 90px rgba(0,0,0,.56);
            text-align: center;
        }
        .game-maintenance .status { color: #c79a55; font: 800 11px Georgia, serif; letter-spacing: .2em; }
        .game-maintenance h1 { margin: 14px 0 12px; font-size: clamp(30px, 8vw, 46px); }
        .game-maintenance p { margin: 0; color: #aaa099; font-size: 13px; line-height: 1.9; }
        .game-maintenance a { min-height: 46px; display: inline-grid; place-items: center; margin-top: 24px; padding: 0 20px; border-radius: 6px; color: #1a140b; background: #c79a55; font-weight: 900; text-decoration: none; }
    </style>
</head>
<body>
    <section class="game-maintenance" aria-labelledby="maintenanceTitle"><span class="status">SECURITY MAINTENANCE</span><h1 id="maintenanceTitle">游戏世界暂停开放</h1><p>为排查可能影响物品与经济系统的问题，游戏场景及相关服务端接口目前均已关闭，无法通过旧链接或旧客户端进入。网站、背包、市场和社区功能仍可正常使用。</p><a href="../bagdemo.html">进入我的背包</a></section>
    <div id="game-container" hidden>
        <div id="loading-status" style="position:absolute;color:#fff;top:50%;left:50%;transform:translate(-50%,-50%);font-family:Microsoft YaHei,sans-serif;text-align:center;z-index:9999;">
            <div style="font-size:32px;color:#c084fc;margin-bottom:15px;font-weight:bold;">旅途冒险家新区</div>
            <div style="font-size:14px;color:#aaaaaa;" id="load-msg">正在加载...</div>
        </div>
        <div id="game-canvas"></div>

        <!-- 游戏内DOM背包 -->
        <div id="gameBagUI">
            <div class="bag-panel">
                <div class="bag-title">
                    背包
                </div>
                <div class="bag-grid" id="bagGridDom"></div>
                <div style="text-align:center;margin-top:12px;color:#7a8a9a;font-size:12px;">桌面：拖拽移动，Q 丢弃 · 手机：点击物品操作</div>
            </div>
        </div>

        <!-- 快捷栏 -->
        <div id="gameHotbar">
            <div class="hotbar-grid" id="hotbarGridDom"></div>
        </div>
    </div>
    <script>
        window.addEventListener('error', function(e) {
            var msg = document.getElementById('load-msg');
            if (msg) msg.innerHTML = '加载错误: ' + (e.message || e.error || '未知错误');
            msg.style.color = '#ff6b6b';
            console.error('加载错误:', e);
        });
        window.addEventListener('unhandledrejection', function(e) {
            var msg = document.getElementById('load-msg');
            if (msg) msg.innerHTML = '连接错误: ' + (e.reason?.message || e.reason || '未知错误');
            msg.style.color = '#ff6b6b';
            console.error('Promise错误:', e);
        });
    </script>
</body>
</html>
