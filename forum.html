<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="device-ui.js?v=16"></script>
<link rel="stylesheet" href="device-ui.css?v=16">
    <title>玩家论坛 - 旅途传说</title>
    <style>
        :root {
            --paper: #fff6e8;
            --card: rgba(255, 246, 232, 0.075);
            --ink: #fffaf2;
            --muted: rgba(255, 250, 242, 0.64);
            --line: rgba(255, 230, 200, 0.16);
            --brand: #8f2730;
            --brand-deep: #3b0d14;
            --gold: #c79a55;
            --shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
            --soft-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            min-height: 100vh;
            padding: 22px 24px 42px;
            color: var(--ink);
            background:
                radial-gradient(circle at 20% 0%, rgba(199, 154, 85, 0.18), transparent 30%),
                radial-gradient(circle at 88% 10%, rgba(143, 39, 48, 0.28), transparent 26%),
                linear-gradient(135deg, #120d0b 0%, #21110f 48%, #090607 100%);
            background-attachment: fixed;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(255, 230, 200, 0.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 230, 200, 0.028) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,.86), transparent 78%);
        }
        button, input, textarea { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        .container {
            position: relative;
            z-index: 1;
            width: min(100%, 1480px);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-areas:
                "header"
                "sections"
                "summary"
                "gate"
                "guest"
                "composer"
                "posts"
                "more";
            gap: 16px;
            align-items: start;
        }
        .header {
            position: relative;
            grid-area: header;
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 16px;
            align-items: center;
            margin-bottom: 0;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 246, 232, 0.07);
            box-shadow: var(--soft-shadow);
            backdrop-filter: blur(14px);
        }
        .back-btn {
            width: 42px;
            height: 42px;
            border: 1px solid rgba(184, 102, 66, 0.24);
            border-radius: 8px;
            background: rgba(255,255,255,.06);
            color: #fff4df;
            cursor: pointer;
            font-size: 0;
            transition: transform .2s ease, border-color .2s ease, background .2s ease;
        }
        .back-btn::before { content: "<"; font-size: 20px; font-weight: 700; }
        .back-btn:hover { transform: translateX(-2px); background: rgba(255,255,255,.1); border-color: rgba(199, 154, 85, 0.34); }
        .profile-link {
            justify-self: end;
            min-height: 42px;
            padding: 0 16px;
            border: 1px solid rgba(199, 154, 85, 0.28);
            border-radius: 8px;
            background: rgba(255,255,255,.07);
            color: #fff4df;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            transition: transform .18s ease, background .18s ease, border-color .18s ease;
        }
        .profile-link:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,.11);
            border-color: rgba(199, 154, 85, 0.44);
        }
        .hero-copy { min-width: 0; }
        .title { font-size: 28px; line-height: 1.1; font-weight: 800; color: #fff4df; letter-spacing: 0; }
        .subtitle { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.6; }
        .guest-panel, .input-area, .item {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--card);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }
        .section-tabs {
            grid-area: sections;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 0;
        }
        .section-tab {
            min-height: 82px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,246,232,.065);
            color: var(--muted);
            cursor: pointer;
            text-align: left;
            transition: transform .18s ease, background .18s ease, border-color .18s ease;
        }
        .section-tab:hover { transform: translateY(-2px); border-color: rgba(199, 154, 85, 0.34); background: rgba(255,246,232,.095); }
        .section-tab.active { border-color: rgba(199, 154, 85, 0.48); background: linear-gradient(135deg, rgba(143,39,48,.26), rgba(199,154,85,.09)); color: #fff4df; }
        .section-tab strong { display: block; margin-bottom: 5px; font-size: 14px; }
        .section-tab span { display: block; line-height: 1.35; font-size: 12px; }
        .section-summary, .section-gate {
            margin-bottom: 0;
            padding: 18px 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,246,232,.06);
            box-shadow: var(--soft-shadow);
        }
        .section-summary { grid-area: summary; }
        .section-gate { grid-area: gate; }
        .section-summary h2, .section-gate h2 { color: #fff4df; font-size: 18px; }
        .section-summary p, .section-gate p { margin-top: 6px; color: var(--muted); line-height: 1.65; font-size: 13px; }
        .gate-row { display: flex; gap: 10px; margin-top: 12px; }
        .gate-row input {
            flex: 1;
            min-width: 0;
            height: 40px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,255,255,.08);
            color: var(--ink);
        }
        .guest-panel { grid-area: guest; padding: 18px; text-align: center; margin-bottom: 0; animation: riseIn .28s ease both; }
        .guest-panel p { color: var(--muted); margin-bottom: 15px; }
        .guest-panel button {
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--brand), var(--brand-deep));
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(184,102,66,.22);
        }
        #postArea { grid-area: composer; width: 100%; }
        .input-area { padding: 18px 20px; margin-bottom: 0; animation: riseIn .28s ease both; }
        .input-area textarea, .title-input, .reply-input {
            width: 100%;
            border: 1px solid var(--line);
            background: rgba(255,255,255,.08);
            color: var(--ink);
            transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
        }
        .input-area textarea { min-height: 118px; padding: 12px; border-radius: 8px; resize: vertical; font-size: 14px; line-height: 1.6; }
        .input-area textarea:focus, .title-input:focus, .reply-input:focus {
            outline: none;
            border-color: rgba(184, 102, 66, 0.62);
            box-shadow: 0 0 0 4px rgba(184,102,66,.10);
            background: rgba(255,255,255,.12);
        }
        .input-row { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
        .composer-meta { display: flex; justify-content: flex-end; margin-top: 8px; color: var(--muted); font-size: 12px; }
        .btn { min-height: 40px; padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
        .btn:hover, .guest-panel button:hover, .reply-btn:hover, .load-more:hover { transform: translateY(-1px); }
        .btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-deep)); color: #fff; box-shadow: 0 10px 22px rgba(184,102,66,.22); }
        .btn-secondary { background: rgba(255,255,255,.07); color: #fff4df; border: 1px solid var(--line); }
        .btn:disabled { opacity: .6; cursor: wait; transform: none; }
        .item {
            position: relative;
            padding: 20px 22px;
            margin-bottom: 14px;
            overflow: hidden;
            content-visibility: auto;
            contain-intrinsic-size: 190px;
            animation: riseIn .32s ease both;
            transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }
        .item::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 3px;
            background: linear-gradient(to bottom, rgba(201,161,95,.8), rgba(184,102,66,.18));
            opacity: 0;
            transition: opacity .2s ease;
        }
        .item:hover { transform: translateY(-2px); box-shadow: 0 22px 55px rgba(74, 46, 28, 0.16); border-color: rgba(184,102,66,.25); }
        .item:hover::before, .item.pinned::before { opacity: 1; }
        .item.pinned { border-color: rgba(201,161,95,.42); background: rgba(255, 246, 232, .105); }
        .item-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 11px; }
        .author-card { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .author-card.clickable, .reply-author.clickable { cursor: pointer; }
        .author-card.clickable:hover .item-name, .reply-author.clickable:hover .reply-user { text-decoration: underline; }
        .avatar {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            border-radius: 8px;
            border: 1px solid rgba(199, 154, 85, 0.34);
            background: linear-gradient(135deg, rgba(143,39,48,.95), rgba(199,154,85,.85));
            color: #fff4df;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            overflow: hidden;
            box-shadow: 0 8px 18px rgba(0,0,0,.18);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .author-info { min-width: 0; }
        .item-name { font-weight: 800; color: #fff4df; word-break: break-word; }
        .identity-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
        .level-badge, .title-badge {
            display: inline-flex;
            align-items: center;
            min-height: 21px;
            padding: 2px 7px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid rgba(199,154,85,.24);
        }
        .level-badge { color: #27160d; background: linear-gradient(135deg, #e5c17c, #b06a38); }
        .title-badge { color: #fff4df; background: rgba(255,255,255,.08); }
        .item-time { flex: 0 0 auto; font-size: 12px; color: var(--muted); }
        .post-title { font-weight: 800; color: #fff4df; margin-bottom: 8px; font-size: 16px; }
        .item-content { line-height: 1.78; word-break: break-word; white-space: pre-wrap; margin-bottom: 14px; max-width: 980px; }
        .post-image { display: block; max-width: min(100%, 760px); max-height: 460px; object-fit: contain; border-radius: 8px; margin-bottom: 12px; cursor: zoom-in; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
        .poll-composer,.poll-box { margin:12px 0; padding:14px; border:1px solid rgba(199,154,85,.3); border-radius:10px; background:rgba(255,255,255,.045); }
        .poll-composer textarea { width:100%; min-height:90px; margin-top:8px; padding:10px; }
        .poll-option { display:flex; align-items:center; gap:9px; width:100%; margin-top:8px; padding:10px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.04); color:inherit; text-align:left; }
        .poll-option:disabled { opacity:.8; }
        .poll-count { margin-left:auto; color:var(--gold); font-weight:800; }
        .btns { display: flex; gap: 8px; font-size: 13px; flex-wrap: wrap; }
        .btns button {
            cursor: pointer;
            color: #fff4df;
            padding: 7px 12px;
            border: 1px solid rgba(184,102,66,.14);
            border-radius: 8px;
            background: rgba(255,255,255,.06);
            transition: transform .18s ease, background .18s ease, border-color .18s ease;
        }
        .btns button:hover { transform: translateY(-1px); background: rgba(255,255,255,.1); border-color: rgba(199, 154, 85, 0.34); }
        .btns button.active { color: #c0392b; background: rgba(231,76,60,.08); }
        .reply-box { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); animation: fadeIn .2s ease both; max-width: 980px; }
        .reply-form { display: flex; gap: 8px; }
        .reply-input { flex: 1; min-width: 0; padding: 10px 11px; border-radius: 8px; font-size: 13px; }
        .reply-btn { padding: 9px 14px; background: var(--brand); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
        .reply-list { margin-top: 10px; }
        .reply-item { padding: 11px; background: rgba(255, 246, 232, 0.06); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; font-size: 13px; overflow: hidden; }
        .reply-main { min-width: 0; overflow: hidden; }
        .reply-author { display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
        .reply-avatar { width: 32px; height: 32px; flex-basis: 32px; font-size: 13px; }
        .reply-header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
        .reply-user { font-weight: 800; color: #ead2ad; }
        .reply-meta { display: flex; gap: 6px; flex-wrap: wrap; margin: 3px 0 6px; }
        .reply-time { font-size: 11px; color: var(--muted); }
        .reply-content { color: rgba(255, 250, 242, 0.78); word-break: break-word; white-space: pre-wrap; line-height: 1.65; }
        .reply-floor { float: left; background: linear-gradient(135deg, var(--gold), var(--brand)); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; margin-right: 8px; box-shadow: 0 4px 12px rgba(184,102,66,.18); }
        .reply-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
        .reply-actions button { border: none; background: transparent; color: var(--muted); cursor: pointer; }
        .reply-actions button.active, .reply-actions button.danger { color: #c0392b; }
        .reply-expand {
            width: 100%;
            padding: 9px;
            border: 1px dashed rgba(199,154,85,.28);
            border-radius: 8px;
            background: rgba(255,255,255,.045);
            color: #fff4df;
            cursor: pointer;
            margin-top: 4px;
        }
        .pinned-tag, .admin-tag { display: inline-flex; align-items: center; min-height: 22px; color: #fff; padding: 2px 8px; border-radius: 8px; font-size: 11px; margin-right: 6px; font-weight: 700; }
        .pinned-tag { background: linear-gradient(135deg, var(--gold), #9b7436); }
        .admin-tag { background: linear-gradient(135deg, #c95f4f, #893021); }
        .empty {
            text-align: center;
            padding: 46px 16px;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,246,232,.07);
            box-shadow: var(--soft-shadow);
        }
        .skeleton-stack { display: grid; gap: 14px; }
        .skeleton-card {
            min-height: 154px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,246,232,.07);
            box-shadow: var(--soft-shadow);
            padding: 16px;
            overflow: hidden;
        }
        .skeleton-line {
            height: 12px;
            margin-bottom: 12px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(199,154,85,.08), rgba(255,255,255,.18), rgba(143,39,48,.12));
            background-size: 220% 100%;
            animation: shimmer 1.2s linear infinite;
        }
        .skeleton-line.short { width: 34%; }
        .skeleton-line.mid { width: 68%; }
        .skeleton-line.long { width: 92%; }
        .color-picker { display: flex; gap: 7px; padding: 5px; border-radius: 8px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
        .color-btn { width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: transform .16s ease, box-shadow .16s ease; }
        .color-btn:hover { transform: scale(1.08); }
        .color-btn.active { box-shadow: 0 0 0 3px rgba(184,102,66,.24), inset 0 0 0 1px rgba(0,0,0,.08); }
        .color-input {
            width: 32px;
            height: 28px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }
        .format-btn.active {
            border-color: rgba(199,154,85,.55);
            background: rgba(199,154,85,.16);
            color: #fff4df;
        }
        .title-input { padding: 11px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
        .image-preview { position: relative; display: inline-block; margin-top: 12px; }
        .image-preview img { max-width: 160px; max-height: 130px; border-radius: 8px; border: 1px solid var(--line); box-shadow: var(--soft-shadow); }
        .image-preview .remove-btn { position: absolute; top: -8px; right: -8px; background: #c0392b; color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; box-shadow: 0 4px 12px rgba(192,57,43,.28); }
        .file-preview, .attachment {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            max-width: 100%;
            margin-top: 12px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255,255,255,.06);
            color: #fff4df;
            font-size: 13px;
        }
        .file-preview button {
            border: none;
            background: transparent;
            color: #ead2ad;
            cursor: pointer;
            font-weight: 800;
        }
        .attachment { margin: 0 0 12px; text-decoration: none; }
        .attachment:hover { border-color: rgba(199, 154, 85, 0.34); }
        #list { grid-area: posts; min-width: 0; }
        .load-more { grid-area: more; display: none; width: 100%; margin: -2px 0 30px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,.07); color: #fff4df; cursor: pointer; box-shadow: var(--soft-shadow); transition: transform .18s ease, background .18s ease; }
        .bgm-btn { position: fixed; bottom: 20px; right: 20px; width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--brand-deep)); border: 1px solid rgba(255,255,255,.35); color: #fff; font-size: 18px; cursor: pointer; z-index: 20; box-shadow: 0 12px 28px rgba(74,46,28,.22); display: flex; align-items: center; justify-content: center; transition: transform .18s ease, opacity .18s ease; }
        .bgm-btn:hover { transform: translateY(-2px) scale(1.03); }
        .bgm-btn.paused { opacity: 0.62; }
        .toast { position: fixed; left: 50%; bottom: 26px; z-index: 60; min-width: 160px; max-width: min(360px, calc(100% - 32px)); padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: rgba(12, 8, 8, 0.86); color: #fff4df; box-shadow: var(--shadow); text-align: center; opacity: 0; transform: translate(-50%, 12px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes shimmer {
            from { background-position: 120% 0; }
            to { background-position: -120% 0; }
        }
        @media (max-width: 980px) {
            body { padding: 16px 12px 36px; }
            .container { width: 100%; }
            .header,
            .section-tabs,
            .section-summary,
            .section-gate,
            .guest-panel,
            #postArea,
            #list {
                margin-bottom: 14px;
            }
            .section-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .section-tab { min-height: 82px; }
            .post-image { max-width: 100%; }
            .reply-box, .item-content { max-width: none; }
            .load-more { margin-top: 0; }
        }
        @media (max-width: 520px) {
            body { padding: 12px 10px 36px; }
            .header { grid-template-columns: 1fr 1fr; padding: 12px; gap: 8px; }
            .hero-copy { grid-column: 1 / -1; grid-row: 1; }
            .header .back-btn,
            .header .profile-link { width: 100%; min-height: 42px; }
            .title { font-size: 23px; }
            .subtitle { font-size: 12px; }
            .input-row { align-items: stretch; }
            .btn { flex: 1 1 auto; }
            .color-picker { width: 100%; justify-content: space-between; }
            .section-tabs { grid-template-columns: 1fr 1fr; }
            .gate-row { flex-direction: column; }
            .item-head, .reply-header { flex-direction: column; gap: 4px; }
            .item-time, .reply-time { flex: auto; }
            .reply-form { flex-direction: column; }
        }
    </style>
</head>
<body>
<audio id="bgmAudio" data-src="bgm.wav" loop preload="none"></audio>
<button class="bgm-btn paused" id="bgmBtn" title="音乐开关">♪</button>

<div class="container">
    <div class="header">
        <button class="back-btn" type="button" onclick="location.href='game.html'">返回主页</button>
        <div class="hero-copy">
            <div class="title">玩家论坛</div>
            <div class="subtitle">分享旅途见闻、提问、吐槽和收藏每一次冒险瞬间。</div>
        </div>
        <button class="profile-link" type="button" onclick="location.href='profile.html'">个人信息</button>
        <button class="profile-link" type="button" onclick="location.href='leaderboard.html'">排行榜</button>
        <button class="profile-link" type="button" onclick="location.href='catalog.html'">图鉴</button>
        <button class="profile-link" type="button" onclick="location.href='market.html'">市场</button>
    </div>

    <div class="section-tabs" id="sectionTabs"></div>
    <div class="section-summary" id="sectionSummary"></div>
    <div class="section-gate" id="sectionGate" style="display:none;">
        <h2>发电用户区</h2>
        <p>该版块仅限发电用户访问。请输入访问密码后浏览和发帖。</p>
        <div class="gate-row">
            <input id="sectionPassword" type="password" placeholder="输入发电用户区密码">
            <button class="btn btn-primary" type="button" onclick="unlockPaidSection()">进入版块</button>
        </div>
    </div>

    <div id="guestPanel" class="guest-panel" style="display: none;">
        <p>当前为游客模式，只能浏览帖子。</p>
        <button type="button" onclick="location.href='game.html'">去登录</button>
    </div>

    <div id="postArea" style="display: none;">
        <div class="input-area">
            <input id="postTitle" class="title-input" placeholder="帖子标题（可选）" maxlength="60">
            <textarea id="postContent" placeholder="分享你的故事..." maxlength="2000"></textarea>
            <div id="pollComposer" class="poll-composer" style="display:none;">
                <b>管理员投票</b><p class="subtitle">每行一个选项，至少 2 项；玩家提交后不能取消。</p>
                <textarea id="pollOptionsInput" maxlength="800" placeholder="选项一&#10;选项二"></textarea>
                <label><input id="pollMultiple" type="checkbox"> 允许一次选择多个选项</label>
            </div>
            <div class="composer-meta"><span id="contentCount">0 / 2000</span></div>
            <div class="input-row">
                <div class="color-picker" id="colorPicker" aria-label="文字颜色"></div>
                <button class="btn btn-secondary format-btn" id="boldBtn" type="button" onclick="toggleFormat('bold')">B</button>
                <button class="btn btn-secondary format-btn" id="italicBtn" type="button" onclick="toggleFormat('italic')"><i>I</i></button>
                <label class="btn btn-secondary" style="cursor:pointer;">
                    添加图片
                    <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImage(this)">
                </label>
                <label class="btn btn-secondary" style="cursor:pointer;">
                    上传文件
                    <input type="file" id="fileInput" style="display:none;" onchange="handleFile(this)">
                </label>
                <button class="btn btn-primary" id="postBtn" type="button" onclick="addPost()">发布帖子</button>
            </div>
            <div id="imagePreview" class="image-preview" style="display:none;">
                <img id="previewImg" alt="图片预览">
                <span class="remove-btn" onclick="removeImage()">×</span>
            </div>
            <div id="filePreview" class="file-preview" style="display:none;">
                <span id="fileName"></span>
                <button type="button" onclick="removeFile()">移除</button>
            </div>
        </div>
    </div>

    <div id="list"><div class="empty">正在加载论坛...</div></div>
    <button id="loadMoreBtn" class="load-more" type="button" onclick="loadList(true)">加载更多</button>
</div>

<script>
const PAGE_SIZE = 25;
const SECTIONS = {
    daily: { title: '日常讨论区', desc: '闲聊、提问、分享日常内容。原有帖子都默认归在这里。' },
    mc: { title: 'MC服务器版块', desc: '交流服务器地址、玩法、建筑、问题反馈和组队。' },
    journey: { title: '旅途传说版块', desc: '讨论《旅途传说》的世界观、玩法、更新建议和攻略。' },
    paid: { title: '发电用户版块', desc: '发电用户专属交流区，可分享文件和内部内容。' }
};
let user = null;
let currentColor = '#333';
let currentBold = false;
let currentItalic = false;
let currentImage = '';
let currentCategory = localStorage.getItem('forum_category') || 'daily';
let paidSectionPass = sessionStorage.getItem('paid_section_pass') || '';
let currentPage = 1;
let hasMore = false;
let loading = false;
const listBox = document.getElementById('list');
const loadMoreBtn = document.getElementById('loadMoreBtn');
const postContentInput = document.getElementById('postContent');
const contentCount = document.getElementById('contentCount');
const fileInput = document.getElementById('fileInput');
let toastTimer = null;

window.addEventListener('DOMContentLoaded', init);

async function init() {
    if (!SECTIONS[currentCategory]) currentCategory = 'daily';
    buildSectionTabs();
    renderSectionHeader();

    if (postContentInput && contentCount) {
        postContentInput.addEventListener('input', updateContentCount);
        updateContentCount();
    }

    const auth = await JourneyAuth.ready;
    if (auth && auth.authenticated && auth.user) {
        user = { userId: auth.user.userId, username: auth.user.user, role: auth.user.role || 'player' };
    }

    if (user) {
        buildColorPicker();
        document.getElementById('postArea').style.display = 'block';
        if (user.role === 'admin') document.getElementById('pollComposer').style.display = 'block';
    } else {
        document.getElementById('guestPanel').style.display = 'block';
    }
    updateProtectedUi();
    if (canReadCurrentSection()) loadList(false);
}

function buildSectionTabs() {
    const tabs = document.getElementById('sectionTabs');
    tabs.textContent = '';
    Object.entries(SECTIONS).forEach(([key, section]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'section-tab' + (key === currentCategory ? ' active' : '');
        btn.innerHTML = `<strong>${section.title}</strong><span>${section.desc}</span>`;
        btn.onclick = () => switchSection(key);
        tabs.appendChild(btn);
    });
}

function renderSectionHeader() {
    const section = SECTIONS[currentCategory] || SECTIONS.daily;
    document.getElementById('sectionSummary').innerHTML = `<h2>${section.title}</h2><p>${section.desc}</p>`;
}

function switchSection(category) {
    currentCategory = SECTIONS[category] ? category : 'daily';
    localStorage.setItem('forum_category', currentCategory);
    currentPage = 1;
    buildSectionTabs();
    renderSectionHeader();
    updateProtectedUi();
    if (canReadCurrentSection()) loadList(false);
}

function canReadCurrentSection() {
    return currentCategory !== 'paid' || Boolean(paidSectionPass);
}

function updateProtectedUi() {
    const locked = currentCategory === 'paid' && !paidSectionPass;
    document.getElementById('sectionGate').style.display = locked ? 'block' : 'none';
    listBox.style.display = locked ? 'none' : 'block';
    if (locked) loadMoreBtn.style.display = 'none';
    document.getElementById('postArea').style.display = user && !locked ? 'block' : 'none';
    document.getElementById('guestPanel').style.display = !user && !locked ? 'block' : 'none';
}

function unlockPaidSection() {
    const input = document.getElementById('sectionPassword');
    const value = input.value.trim();
    if (!value) return showToast('请输入访问密码');
    paidSectionPass = value;
    sessionStorage.setItem('paid_section_pass', value);
    updateProtectedUi();
    loadList(false);
}

function updateContentCount() {
    contentCount.textContent = `${postContentInput.value.length} / ${postContentInput.maxLength || 2000}`;
}

function showToast(message) {
    let toast = document.getElementById('toast');
    if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast';
        toast.className = 'toast';
        document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
}

function buildColorPicker() {
    const colors = ['#333', '#c57f5e', '#5a9b5a', '#4a8cbb', '#9b59b6', '#e74c3c', '#f39c12'];
    const picker = document.getElementById('colorPicker');
    picker.textContent = '';
    colors.forEach((color) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'color-btn' + (color === currentColor ? ' active' : '');
        btn.style.background = color;
        btn.setAttribute('aria-label', `选择颜色 ${color}`);
        btn.onclick = () => {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach((item) => item.classList.remove('active'));
            btn.classList.add('active');
        };
        picker.appendChild(btn);
    });
    const input = document.createElement('input');
    input.type = 'color';
    input.className = 'color-input';
    input.value = currentColor === '#333' ? '#fffaf2' : currentColor;
    input.title = '自定义文字颜色';
    input.oninput = () => {
        currentColor = input.value;
        document.querySelectorAll('.color-btn').forEach((item) => item.classList.remove('active'));
    };
    picker.appendChild(input);
}

function toggleFormat(type) {
    if (type === 'bold') currentBold = !currentBold;
    if (type === 'italic') currentItalic = !currentItalic;
    syncFormatButtons();
}

function syncFormatButtons() {
    document.getElementById('boldBtn').classList.toggle('active', currentBold);
    document.getElementById('italicBtn').classList.toggle('active', currentItalic);
}

async function handleImage(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    if (!file.type.startsWith('image/')) return;
    input.disabled = true;
    try {
        const bitmap = await createImageBitmap(file);
        const maxSide = 1600;
        const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        canvas.getContext('2d', { alpha:false }).drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        bitmap.close();
        let blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/webp', .82));
        if (!blob || blob.size > 850 * 1024) blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', .72));
        if (!blob || blob.size > 900 * 1024) throw new Error('too_large');
        currentImage = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=reject; reader.readAsDataURL(blob); });
        document.getElementById('previewImg').src = currentImage;
        document.getElementById('imagePreview').style.display = 'inline-block';
        showToast(`图片已自动压缩至 ${formatFileSize(blob.size)}`);
    } catch (error) {
        input.value = ''; showToast('图片压缩失败，请更换图片');
    } finally { input.disabled = false; }
}

function handleFile(input) {
    if (!input.files || !input.files[0]) return;
    const file = input.files[0];
    if (file.size > 10 * 1024 * 1024) {
        showToast('文件不能超过 10MB');
        input.value = '';
        return;
    }
    document.getElementById('fileName').textContent = `${file.name} · ${formatFileSize(file.size)}`;
    document.getElementById('filePreview').style.display = 'inline-flex';
}

function removeFile() {
    if (fileInput) fileInput.value = '';
    document.getElementById('filePreview').style.display = 'none';
}

function formatFileSize(size) {
    if (!size) return '0 B';
    if (size < 1024) return `${size} B`;
    if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
    return `${(size / 1024 / 1024).toFixed(1)} MB`;
}

function removeImage() {
    currentImage = '';
    document.getElementById('imageInput').value = '';
    document.getElementById('imagePreview').style.display = 'none';
}

async function loadList(append) {
    if (loading) return;
    loading = true;
    currentPage = append ? currentPage + 1 : 1;
    if (!append) renderLoading();
    loadMoreBtn.disabled = true;

    try {
        const params = new URLSearchParams({ action: 'get', page: String(currentPage), limit: String(PAGE_SIZE), category: currentCategory });
        if (user && user.userId) params.set('userId', user.userId);
        if (currentCategory === 'paid') params.set('sectionPass', paidSectionPass);
        const res = await fetch(`board.php?${params.toString()}`, { cache: 'no-store' });
        if (res.status === 403) {
            paidSectionPass = '';
            sessionStorage.removeItem('paid_section_pass');
            updateProtectedUi();
            showToast('发电用户区密码错误');
            return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const payload = await res.json();
        const posts = Array.isArray(payload) ? payload : (payload.posts || []);
        hasMore = Array.isArray(payload) ? posts.length === PAGE_SIZE : Boolean(payload.hasMore);
        renderList(posts, append);
    } catch (e) {
        if (append) currentPage -= 1;
        listBox.innerHTML = '<div class="empty">加载失败，请稍后刷新重试。</div>';
        hasMore = false;
    } finally {
        loading = false;
        loadMoreBtn.disabled = false;
        loadMoreBtn.style.display = hasMore ? 'block' : 'none';
    }
}

function renderList(posts, append) {
    if (!append) listBox.textContent = '';
    if (!posts.length && !append) {
        listBox.innerHTML = '<div class="empty">暂无帖子</div>';
        return;
    }

    const fragment = document.createDocumentFragment();
    posts.forEach((post) => fragment.appendChild(createPostElement(post)));
    listBox.appendChild(fragment);
}

function renderLoading() {
    listBox.innerHTML = `
        <div class="skeleton-stack" aria-label="正在加载论坛">
            <div class="skeleton-card">
                <div class="skeleton-line short"></div>
                <div class="skeleton-line long"></div>
                <div class="skeleton-line mid"></div>
                <div class="skeleton-line short"></div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-line mid"></div>
                <div class="skeleton-line long"></div>
                <div class="skeleton-line long"></div>
                <div class="skeleton-line short"></div>
            </div>
        </div>
    `;
}

function createPostElement(post) {
    const item = document.createElement('article');
    item.className = 'item' + (post.pinned ? ' pinned' : '');

    const head = document.createElement('div');
    head.className = 'item-head';
    const nameLine = document.createElement('div');
    if (post.pinned) nameLine.appendChild(tag('置顶', 'pinned-tag'));
    if (post.authorMeta && post.authorMeta.role === 'admin') nameLine.appendChild(tag('管理员', 'admin-tag'));
    const name = document.createElement('span');
    name.className = 'item-name';
    name.textContent = post.user || '匿名玩家';
    nameLine.appendChild(name);
    const time = document.createElement('div');
    time.className = 'item-time';
    time.textContent = post.time || '';
    head.append(nameLine, time);
    item.appendChild(head);

    if (post.title) {
        const title = document.createElement('div');
        title.className = 'post-title';
        title.textContent = post.title;
        item.appendChild(title);
    }

    const content = document.createElement('div');
    content.className = 'item-content';
    content.style.color = safeColor(post.color);
    content.textContent = post.content || '';
    item.appendChild(content);

    if (post.image) {
        const img = document.createElement('img');
        img.className = 'post-image';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = post.image;
        img.alt = '帖子图片';
        img.onclick = () => showFullImage(post.image);
        item.appendChild(img);
    }

    if (post.file && post.file.stored) {
        const link = document.createElement('a');
        link.className = 'attachment';
        const params = new URLSearchParams({ action: 'download', file: post.file.stored });
        if (post.category === 'paid') params.set('sectionPass', paidSectionPass);
        link.href = `board.php?${params.toString()}`;
        link.textContent = `下载附件：${post.file.name || '文件'} (${formatFileSize(post.file.size || 0)})`;
        item.appendChild(link);
    }

    const replyList = Array.isArray(post.reply) ? post.reply : [];
    const actions = document.createElement('div');
    actions.className = 'btns';
    actions.appendChild(actionButton(`回复(${replyList.length})`, () => toggleReply(post.idx)));
    actions.appendChild(actionButton(`点赞(${post.likeNum || 0})`, () => doLike(post.idx), post.liked));
    if (post.isMine) actions.appendChild(actionButton('删除', () => doDel(post.idx)));
    if (user && user.role === 'admin') actions.appendChild(actionButton(post.pinned ? '取消置顶' : '置顶', () => doPin(post.idx)));
    item.appendChild(actions);

    const replyBox = document.createElement('div');
    replyBox.id = `replyBox${post.idx}`;
    replyBox.className = 'reply-box';
    replyBox.style.display = 'none';
    replyBox.appendChild(createReplyForm(post.idx));
    replyBox.appendChild(createReplyList(post.idx, replyList));
    item.appendChild(replyBox);

    return item;
}

function tag(text, className) {
    const span = document.createElement('span');
    span.className = className;
    span.textContent = text;
    return span;
}

function actionButton(text, handler, active) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = text;
    if (active) btn.classList.add('active');
    btn.onclick = handler;
    return btn;
}

function createReplyForm(postIdx) {
    const form = document.createElement('div');
    form.className = 'reply-form';
    const input = document.createElement('input');
    input.className = 'reply-input';
    input.id = `replyInput${postIdx}`;
    input.placeholder = user ? '写下你的回复...' : '登录后可以回复';
    input.disabled = !user;
    input.maxLength = 800;
    const button = document.createElement('button');
    button.className = 'reply-btn';
    button.type = 'button';
    button.textContent = '发送';
    button.disabled = !user;
    button.onclick = () => doReply(postIdx);
    form.append(input, button);
    return form;
}

function createReplyList(postIdx, replies) {
    const box = document.createElement('div');
    box.id = `replyList${postIdx}`;
    box.className = 'reply-list';
    const sortedReplies = replies
        .map((reply, index) => ({ ...reply, floor: index + 1, originalIndex: index }))
        .sort((a, b) => (b.replyLikeNum || 0) - (a.replyLikeNum || 0));

    sortedReplies.forEach((reply) => {
        const item = document.createElement('div');
        item.className = 'reply-item';
        const floor = document.createElement('span');
        floor.className = 'reply-floor';
        floor.textContent = reply.floor;

        const header = document.createElement('div');
        header.className = 'reply-header';
        const name = document.createElement('span');
        name.className = 'reply-user';
        name.textContent = reply.user || '匿名玩家';
        const time = document.createElement('span');
        time.className = 'reply-time';
        time.textContent = reply.time || '';
        header.append(name, time);

        const content = document.createElement('div');
        content.className = 'reply-content';
        content.textContent = reply.content || '';

        const actions = document.createElement('div');
        actions.className = 'reply-actions';
        actions.appendChild(actionButton(`赞(${reply.replyLikeNum || 0})`, () => doReplyLike(postIdx, reply.originalIndex), reply.replyLiked));
        if (user && user.role === 'admin') {
            const del = actionButton('删除', () => doDelReply(postIdx, reply.originalIndex));
            del.classList.add('danger');
            actions.appendChild(del);
        }

        item.append(floor, header, content, actions);
        box.appendChild(item);
    });
    return box;
}

function safeColor(color) {
    if (!/^#[0-9a-f]{3,6}$/i.test(color || '')) return 'rgba(255, 250, 242, 0.82)';
    const normalized = color.toLowerCase();
    if (normalized === '#333' || normalized === '#333333') return 'rgba(255, 250, 242, 0.82)';
    return color;
}

function showFullImage(src) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.82);display:flex;align-items:center;justify-content:center;z-index:99999;cursor:pointer;padding:12px;';
    overlay.onclick = () => overlay.remove();
    const img = document.createElement('img');
    img.src = src;
    img.alt = '查看大图';
    img.style.cssText = 'max-width:95%;max-height:95%;border-radius:8px;';
    overlay.appendChild(img);
    document.body.appendChild(overlay);
}

function toggleReply(idx) {
    const box = document.getElementById(`replyBox${idx}`);
    if (!box) return;
    const willOpen = box.style.display === 'none';
    box.style.display = willOpen ? 'block' : 'none';
    if (willOpen) {
        const input = box.querySelector('.reply-input:not(:disabled)');
        if (input) setTimeout(() => input.focus(), 80);
    }
}

async function addPost() {
    if (!user) return;
    const title = document.getElementById('postTitle').value.trim();
    const content = document.getElementById('postContent').value.trim();
    if (!content && !currentImage) {
        showToast('请输入内容或添加图片');
        return;
    }

    const btn = document.getElementById('postBtn');
    btn.disabled = true;
    const formData = new FormData();
    formData.append('action', 'add');
    formData.append('userId', user.userId);
    formData.append('content', content);
    formData.append('color', currentColor);
    formData.append('bold', currentBold ? '1' : '0');
    formData.append('italic', currentItalic ? '1' : '0');
    formData.append('title', title);
    if (user.role === 'admin') {
        const pollOptions = document.getElementById('pollOptionsInput').value.split(/\r?\n/).map((value) => value.trim()).filter(Boolean);
        if (pollOptions.length) {
            formData.append('pollOptions', JSON.stringify(pollOptions));
            formData.append('pollMultiple', document.getElementById('pollMultiple').checked ? '1' : '0');
        }
    }
    if (currentImage) formData.append('image', currentImage);

    try {
        const res = await fetch('board.php', { method: 'POST', body: formData });
        if ((await res.text()).trim() === 'ok') {
            document.getElementById('postContent').value = '';
            document.getElementById('postTitle').value = '';
            if (user.role === 'admin') { document.getElementById('pollOptionsInput').value = ''; document.getElementById('pollMultiple').checked = false; }
            updateContentCount();
            removeImage();
            showToast('发布成功');
            loadList(false);
        } else {
            alert('发布失败，请稍后再试');
        }
    } finally {
        btn.disabled = false;
    }
}

async function doLike(idx) {
    if (!user) return showToast('请先登录');
    await fetch(`board.php?action=like&idx=${idx}&userId=${encodeURIComponent(user.userId)}`);
    showToast('点赞状态已更新');
    loadList(false);
}

async function doReply(idx) {
    if (!user) return showToast('请先登录');
    const input = document.getElementById(`replyInput${idx}`);
    const content = input.value.trim();
    if (!content) return;
    const params = new URLSearchParams({ action: 'reply', idx: String(idx), userId: user.userId, content });
    const res = await fetch(`board.php?${params.toString()}`);
    if ((await res.text()).trim() === 'ok') {
        input.value = '';
        showToast('回复成功');
        loadList(false);
    }
}

async function doReplyLike(idx, pid) {
    if (!user) return showToast('请先登录');
    await fetch(`board.php?action=replyLike&idx=${idx}&pid=${pid}&userId=${encodeURIComponent(user.userId)}`);
    showToast('回复点赞已更新');
    loadList(false);
}

async function doDel(idx) {
    if (!user || !confirm('确定删除这个帖子吗？')) return;
    const res = await fetch(`board.php?action=del&idx=${idx}&userId=${encodeURIComponent(user.userId)}`);
    if ((await res.text()).trim() === 'ok') loadList(false);
}

async function doDelReply(idx, pid) {
    if (!user || !confirm('确定删除这条回复吗？')) return;
    const res = await fetch(`board.php?action=delReply&idx=${idx}&pid=${pid}&userId=${encodeURIComponent(user.userId)}`);
    if ((await res.text()).trim() === 'ok') loadList(false);
}

async function doPin(idx) {
    if (!user || user.role !== 'admin') return;
    await fetch(`board.php?action=pin&idx=${idx}&userId=${encodeURIComponent(user.userId)}`);
    loadList(false);
}

async function addPost() {
    if (!user) return;
    const title = document.getElementById('postTitle').value.trim();
    const content = document.getElementById('postContent').value.trim();
    const uploadFile = fileInput && fileInput.files ? fileInput.files[0] : null;
    const hasPollDraft = user.role === 'admin' && document.getElementById('pollOptionsInput').value.trim();
    if (!content && !currentImage && !uploadFile && !hasPollDraft) {
        showToast('请输入内容、图片或文件');
        return;
    }

    const btn = document.getElementById('postBtn');
    btn.disabled = true;
    const formData = new FormData();
    formData.append('action', 'add');
    formData.append('userId', user.userId);
    formData.append('content', content);
    formData.append('color', currentColor);
    formData.append('bold', currentBold ? '1' : '0');
    formData.append('italic', currentItalic ? '1' : '0');
    formData.append('title', title);
    formData.append('category', currentCategory);
    if (user.role === 'admin') {
        const pollOptions = document.getElementById('pollOptionsInput').value.split(/\r?\n/).map((value) => value.trim()).filter(Boolean);
        if (pollOptions.length) {
            formData.append('pollOptions', JSON.stringify(pollOptions));
            formData.append('pollMultiple', document.getElementById('pollMultiple').checked ? '1' : '0');
        }
    }
    if (currentCategory === 'paid') formData.append('sectionPass', paidSectionPass);
    if (currentImage) formData.append('image', currentImage);
    if (uploadFile) formData.append('uploadFile', uploadFile);

    try {
        const res = await fetch('board.php', { method: 'POST', body: formData });
        const result = parseActionResult(await res.text());
        if (result.code === 'ok') {
            document.getElementById('postContent').value = '';
            document.getElementById('postTitle').value = '';
            if (user.role === 'admin') { document.getElementById('pollOptionsInput').value = ''; document.getElementById('pollMultiple').checked = false; }
            updateContentCount();
            removeImage();
            removeFile();
            currentBold = false;
            currentItalic = false;
            syncFormatButtons();
            showToast(result.goldGain ? `每日奖励：经验 +${result.xpGain}，金币 +${result.goldGain}` : '发布成功（今日奖励已领取）');
            loadList(false);
        } else if (result.code === 'file_too_large') {
            showToast('文件不能超过 10MB');
        } else if (result.code === 'file_type_blocked') {
            showToast('该文件类型不允许上传');
        } else if (result.code === 'forbidden') {
            showToast('发电用户区密码错误');
        } else if (result.code === 'daily_post_limit') {
            showToast('今天已发表 5 篇主题，明天再继续分享吧');
        } else if (result.code === 'rate_limited') {
            showToast('操作太频繁，请稍后再试');
        } else if (result.code === 'content_too_long' || result.code === 'title_too_long') {
            showToast('标题或正文超过长度限制');
        } else {
            showToast('发布失败，请稍后再试');
        }
    } finally {
        btn.disabled = false;
    }
}

function withSectionParams(params) {
    params.set('category', currentCategory);
    if (currentCategory === 'paid') params.set('sectionPass', paidSectionPass);
    return params;
}

function postForumAction(params) {
    return fetch('board.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
        body: withSectionParams(params)
    });
}

function parseActionResult(text) {
    const trimmed = (text || '').trim();
    if (trimmed === 'ok') return { code: 'ok', xpGain: 0 };
    try {
        const data = JSON.parse(trimmed);
        return data && data.code ? data : { code: trimmed };
    } catch (e) {
        return { code: trimmed };
    }
}

async function doLike(idx) {
    if (!user) return showToast('请先登录');
    const params = new URLSearchParams({ action: 'like', idx: String(idx) });
    const res = await postForumAction(params);
    if (res.status === 403) return showToast('发电用户区密码错误');
    showToast('点赞状态已更新');
    loadList(false);
}

async function doReply(idx) {
    if (!user) return showToast('请先登录');
    const input = document.getElementById(`replyInput${idx}`);
    const content = input.value.trim();
    if (!content) return;
    const params = new URLSearchParams({ action: 'reply', idx: String(idx), content });
    const res = await postForumAction(params);
    if (res.status === 403) return showToast('发电用户区密码错误');
    const result = parseActionResult(await res.text());
    if (result.code === 'ok') {
        input.value = '';
        showToast(result.xpGain ? `回复成功，经验 +${result.xpGain}` : '回复成功');
        loadList(false);
    }
}

async function doReplyLike(idx, pid) {
    if (!user) return showToast('请先登录');
    const params = new URLSearchParams({ action: 'replyLike', idx: String(idx), pid: String(pid) });
    const res = await postForumAction(params);
    if (res.status === 403) return showToast('发电用户区密码错误');
    showToast('回复点赞已更新');
    loadList(false);
}

async function doDel(idx) {
    if (!user || !confirm('确定删除这个帖子吗？')) return;
    const params = new URLSearchParams({ action: 'del', idx: String(idx) });
    const res = await postForumAction(params);
    if (res.status === 403) return showToast('发电用户区密码错误');
    if ((await res.text()).trim() === 'ok') loadList(false);
}

async function doDelReply(idx, pid) {
    if (!user || !confirm('确定删除这条回复吗？')) return;
    const params = new URLSearchParams({ action: 'delReply', idx: String(idx), pid: String(pid) });
    const res = await postForumAction(params);
    if (res.status === 403) return showToast('发电用户区密码错误');
    if ((await res.text()).trim() === 'ok') loadList(false);
}

async function doPin(idx) {
    if (!user || user.role !== 'admin') return;
    const params = new URLSearchParams({ action: 'pin', idx: String(idx) });
    const res = await postForumAction(params);
    if (res.status === 403) return showToast('发电用户区密码错误');
    loadList(false);
}

const expandedReplies = new Set();

function renderAvatar(meta, userName, extraClass) {
    const avatar = document.createElement('span');
    avatar.className = 'avatar' + (extraClass ? ` ${extraClass}` : '');
    const data = meta && meta.avatar ? meta.avatar : null;
    if (data && data.type === 'image' && data.src) {
        const img = document.createElement('img');
        img.src = data.src;
        img.alt = `${userName || '玩家'}的头像`;
        avatar.appendChild(img);
    } else {
        avatar.textContent = (data && data.text) || (userName ? Array.from(userName)[0] : '旅');
        if (data && data.color) avatar.style.background = data.color;
    }
    return avatar;
}

function renderIdentity(meta) {
    const row = document.createElement('div');
    row.className = 'identity-row';
    const level = document.createElement('span');
    level.className = 'level-badge';
    level.textContent = `Lv.${meta && meta.level ? meta.level : 1}`;
    const title = document.createElement('span');
    title.className = 'title-badge';
    title.textContent = meta && meta.title ? meta.title : '初来乍到';
    row.append(level, title);
    return row;
}

function openUserProfile(userId) {
    if (!userId) return;
    location.href = `profile.html?userId=${encodeURIComponent(userId)}`;
}

function createPostElement(post) {
    const item = document.createElement('article');
    item.className = 'item' + (post.pinned ? ' pinned' : '');

    const head = document.createElement('div');
    head.className = 'item-head';

    const author = document.createElement('div');
    author.className = 'author-card';
    if (post.userId) {
        author.classList.add('clickable');
        author.onclick = () => openUserProfile(post.userId);
    }
    author.appendChild(renderAvatar(post.authorMeta, post.user));

    const authorInfo = document.createElement('div');
    authorInfo.className = 'author-info';
    const nameLine = document.createElement('div');
    if (post.pinned) nameLine.appendChild(tag('置顶', 'pinned-tag'));
    if (post.authorMeta && post.authorMeta.role === 'admin') nameLine.appendChild(tag('管理员', 'admin-tag'));
    const name = document.createElement('span');
    name.className = 'item-name';
    name.textContent = post.user || '匿名玩家';
    nameLine.appendChild(name);
    authorInfo.append(nameLine, renderIdentity(post.authorMeta));
    author.appendChild(authorInfo);

    const time = document.createElement('div');
    time.className = 'item-time';
    time.textContent = post.time || '';
    head.append(author, time);
    item.appendChild(head);

    if (post.title) {
        const title = document.createElement('div');
        title.className = 'post-title';
        title.textContent = post.title;
        item.appendChild(title);
    }

    const content = document.createElement('div');
    content.className = 'item-content';
    content.style.color = safeColor(post.color);
    content.style.fontWeight = post.bold ? '800' : '400';
    content.style.fontStyle = post.italic ? 'italic' : 'normal';
    content.textContent = post.content || '';
    item.appendChild(content);

    if (post.image) {
        const img = document.createElement('img');
        img.className = 'post-image';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = post.image;
        img.alt = '帖子图片';
        img.onclick = () => showFullImage(post.image);
        item.appendChild(img);
    }

    if (post.file && post.file.stored) {
        const link = document.createElement('a');
        link.className = 'attachment';
        const params = new URLSearchParams({ action: 'download', file: post.file.stored });
        if (post.category === 'paid') params.set('sectionPass', paidSectionPass);
        link.href = `board.php?${params.toString()}`;
        link.textContent = `下载附件：${post.file.name || '文件'} (${formatFileSize(post.file.size || 0)})`;
        item.appendChild(link);
    }

    if (post.poll && Array.isArray(post.poll.options)) item.appendChild(createPollBox(post));

    const replyList = Array.isArray(post.reply) ? post.reply : [];
    const actions = document.createElement('div');
    actions.className = 'btns';
    actions.appendChild(actionButton(`回复(${replyList.length})`, () => toggleReply(post.idx)));
    actions.appendChild(actionButton(`点赞(${post.likeNum || 0})`, () => doLike(post.idx), post.liked));
    if (post.isMine) actions.appendChild(actionButton('删除', () => doDel(post.idx)));
    if (user && user.role === 'admin') actions.appendChild(actionButton(post.pinned ? '取消置顶' : '置顶', () => doPin(post.idx)));
    item.appendChild(actions);

    const replyBox = document.createElement('div');
    replyBox.id = `replyBox${post.idx}`;
    replyBox.className = 'reply-box';
    replyBox.style.display = 'none';
    replyBox.appendChild(createReplyForm(post.idx));
    replyBox.appendChild(createReplyList(post.idx, replyList));
    item.appendChild(replyBox);

    return item;
}

function createPollBox(post) {
    const poll = post.poll;
    const box = document.createElement('div'); box.className = 'poll-box';
    const heading = document.createElement('b'); heading.textContent = `投票 · ${poll.multiple ? '可多选' : '单选'} · ${poll.voterCount || 0} 人已投`;
    box.appendChild(heading);
    const name = `poll-${post.idx}`;
    poll.options.forEach((option) => {
        const label = document.createElement('label'); label.className = 'poll-option';
        const input = document.createElement('input'); input.type = poll.multiple ? 'checkbox' : 'radio'; input.name = name; input.value = option.id;
        input.disabled = !user || poll.hasVoted; input.checked = (poll.mySelections || []).includes(option.id);
        const text = document.createElement('span'); text.textContent = option.text;
        const count = document.createElement('span'); count.className = 'poll-count'; count.textContent = `${option.voteCount || 0} 票`;
        label.append(input, text, count); box.appendChild(label);
    });
    if (!poll.hasVoted) {
        const button = document.createElement('button'); button.className = 'btn btn-primary'; button.type = 'button'; button.textContent = user ? '提交投票' : '登录后投票'; button.disabled = !user;
        button.onclick = () => submitPoll(post.idx, box); box.appendChild(button);
    } else {
        const note = document.createElement('div'); note.className = 'subtitle'; note.textContent = '你已投票，投票不可取消。'; box.appendChild(note);
    }
    return box;
}

async function submitPoll(postIdx, box) {
    const selections = [...box.querySelectorAll('input:checked')].map((input) => input.value);
    if (!selections.length) return showToast('请至少选择一个选项');
    const form = new FormData(); form.append('action','votePoll'); form.append('userId',user.userId); form.append('idx',String(postIdx)); form.append('selections',JSON.stringify(selections));
    const response = await fetch('board.php', { method:'POST', body:form }); const data = await response.json();
    if (data.code !== 'ok') return showToast(data.code === 'already_voted' ? '你已经投过票' : '投票失败');
    showToast('投票成功，提交后不可取消'); loadList(false);
}

function createReplyList(postIdx, replies) {
    const box = document.createElement('div');
    box.id = `replyList${postIdx}`;
    box.className = 'reply-list';

    const sortedReplies = replies
        .map((reply, index) => ({ ...reply, floor: index + 1, originalIndex: index }))
        .sort((a, b) => {
            const likeDiff = (b.replyLikeNum || 0) - (a.replyLikeNum || 0);
            return likeDiff !== 0 ? likeDiff : b.originalIndex - a.originalIndex;
        });

    const expanded = expandedReplies.has(String(postIdx));
    const visibleReplies = expanded ? sortedReplies : sortedReplies.slice(0, 3);

    visibleReplies.forEach((reply) => {
        const item = document.createElement('div');
        item.className = 'reply-item';

        const floor = document.createElement('span');
        floor.className = 'reply-floor';
        floor.textContent = reply.floor;

        const wrap = document.createElement('div');
        wrap.className = 'reply-author';
        if (reply.userId) {
            wrap.classList.add('clickable');
            wrap.onclick = (event) => {
                if (event.target.closest('button')) return;
                openUserProfile(reply.userId);
            };
        }
        wrap.appendChild(renderAvatar(reply.authorMeta, reply.user, 'reply-avatar'));

        const main = document.createElement('div');
        main.className = 'reply-main';

        const header = document.createElement('div');
        header.className = 'reply-header';
        const name = document.createElement('span');
        name.className = 'reply-user';
        name.textContent = reply.user || '匿名玩家';
        const time = document.createElement('span');
        time.className = 'reply-time';
        time.textContent = reply.time || '';
        header.append(name, time);

        const meta = document.createElement('div');
        meta.className = 'reply-meta';
        const level = document.createElement('span');
        level.className = 'level-badge';
        level.textContent = `Lv.${reply.authorMeta && reply.authorMeta.level ? reply.authorMeta.level : 1}`;
        const title = document.createElement('span');
        title.className = 'title-badge';
        title.textContent = reply.authorMeta && reply.authorMeta.title ? reply.authorMeta.title : '初来乍到';
        meta.append(level, title);

        const content = document.createElement('div');
        content.className = 'reply-content';
        content.textContent = reply.content || '';

        const actions = document.createElement('div');
        actions.className = 'reply-actions';
        actions.appendChild(actionButton(`赞(${reply.replyLikeNum || 0})`, () => doReplyLike(postIdx, reply.originalIndex), reply.replyLiked));
        if (user && user.role === 'admin') {
            const del = actionButton('删除', () => doDelReply(postIdx, reply.originalIndex));
            del.classList.add('danger');
            actions.appendChild(del);
        }

        main.append(header, meta, content, actions);
        wrap.appendChild(main);
        item.append(floor, wrap);
        box.appendChild(item);
    });

    if (sortedReplies.length > 3) {
        const expand = document.createElement('button');
        expand.type = 'button';
        expand.className = 'reply-expand';
        expand.textContent = expanded ? '收起回复' : `展开全部 ${sortedReplies.length} 条回复`;
        expand.onclick = () => {
            const key = String(postIdx);
            if (expandedReplies.has(key)) expandedReplies.delete(key);
            else expandedReplies.add(key);
            box.replaceWith(createReplyList(postIdx, replies));
        };
        box.appendChild(expand);
    }

    return box;
}

const bgmAudio = document.getElementById('bgmAudio');
const bgmBtn = document.getElementById('bgmBtn');
let bgmPlaying = false;

bgmBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bgmPlaying) {
        bgmAudio.pause();
        bgmPlaying = false;
        bgmBtn.textContent = '♪';
        bgmBtn.classList.add('paused');
        return;
    }
    if (!bgmAudio.src) {
        bgmAudio.src = bgmAudio.dataset.src;
    }
    bgmAudio.play().then(() => {
        bgmPlaying = true;
        bgmBtn.textContent = 'Ⅱ';
        bgmBtn.classList.remove('paused');
    }).catch(() => {});
});
</script>
