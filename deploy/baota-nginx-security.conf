# 旅途传说：宝塔 Nginx 站点安全片段
#
# 仅把本文件的内容粘贴到该站点现有的 server { ... } 内。
# 不要粘贴到 nginx.conf 的 http {} 外，也不要用它覆盖宝塔生成的完整站点配置。
# 建议放在宝塔的 PHP include（例如 include enable-php-84.conf;）之前。

server_tokens off;
autoindex off;

# 应用实际只接受 10 MiB 上传；为 multipart 表单保留少量协议开销。
client_max_body_size 12m;

# 文本资源启用传输压缩；图片和音频通常已经压缩，不重复消耗 CPU。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

# 必须先确认 HTTPS 已正常工作再启用 HSTS。这里没有 includeSubDomains，避免误伤尚未启用 HTTPS 的子域名。
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HTML 每次协商版本，静态代码与媒体由浏览器复用，显著减少重复下载。
location ~* \.(?:html?)$ {
    expires -1;
    try_files $uri =404;
}

location ~* \.(?:css|js)$ {
    expires 7d;
    try_files $uri =404;
}

location ~* \.(?:png|jpe?g|gif|webp|svg|ico|wav|mp3|ogg|woff2?)$ {
    expires 30d;
    try_files $uri =404;
}

# 数据库、历史 JSON、上传原件和运维脚本只能由 PHP/CLI 从服务器本地访问。
# .uploads 中的附件必须通过 board.php 的鉴权下载动作读取，不能暴露真实存储路径。
location ^~ /.journey-data/ {
    return 404;
}

location ^~ /.uploads/ {
    return 404;
}

location ^~ /scripts/ {
    return 404;
}

location ^~ /lib/ {
    return 404;
}

location ^~ /deploy/ {
    return 404;
}

location = /update_ids.php {
    return 404;
}

location = /journey-config.php {
    return 404;
}

location = /journey-config.example.php {
    return 404;
}

# 旧版 users.json、posts.json 等可能包含账号、口令或内部数据；统一禁止直访。
location ~* \.json$ {
    return 404;
}

# 隐藏 .git、.env、.user.ini、.htaccess 等点文件，但保留 ACME 证书校验目录。
location ~ "(^|/)\.(?!well-known(?:/|$))" {
    return 404;
}

# 阻止数据库、备份、日志、配置和部署文档意外进入静态下载路径。
location ~* "\.(?:sqlite|sqlite3|db|sql|bak|backup|old|orig|save|swp|log|ini|conf|env|md)$" {
    return 404;
}
