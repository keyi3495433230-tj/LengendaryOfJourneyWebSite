<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#11100e">
    <title>联络人 · 旅途传说</title>
<script src="device-ui.js?v=17"></script>
<link rel="stylesheet" href="device-ui.css?v=16">
    <style>
        :root{color-scheme:dark;--ink:#f3eee4;--muted:#8f8a81;--line:rgba(224,190,126,.18);--gold:#d6a95d;--rust:#8c3f2d;--panel:#171513;--common:#c8c8c2;--uncommon:#68c988;--rare:#6ba9ef;--epic:#bb7add;--legendary:#e06351}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:radial-gradient(circle at 80% 0,rgba(140,63,45,.18),transparent 24%),repeating-linear-gradient(135deg,rgba(255,255,255,.014) 0 1px,transparent 1px 11px),#0a0908}button,a{font:inherit}.page{width:min(1380px,calc(100% - 30px));margin:auto;padding:18px 0 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 17px;border:1px solid var(--line);border-radius:6px;background:rgba(17,15,13,.92)}.brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font-weight:900}.brand img{width:38px;height:38px;border-radius:5px}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav a{min-height:38px;display:grid;place-items:center;padding:0 12px;border:1px solid transparent;border-radius:4px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:800}.nav a:hover,.nav a.is-current{border-color:var(--line);color:var(--ink);background:#23201c}
        .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;margin-top:14px}.contact{position:sticky;top:14px;align-self:start;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:linear-gradient(160deg,#201b17,#100f0d);box-shadow:0 20px 60px rgba(0,0,0,.25)}.portrait{position:relative;height:290px;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(214,169,93,.15),transparent 34%),linear-gradient(150deg,#29221c,#0d0c0b)}.portrait::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,#171310)}.portrait img{width:100%;height:100%;object-fit:cover}.portrait-initial{font:900 110px "STKaiti","KaiTi",serif;color:rgba(214,169,93,.65)}.contact-copy{padding:20px}.contact-kicker{color:var(--gold);font:700 10px Georgia,serif;letter-spacing:.2em}.contact h1{margin:7px 0 3px;font-size:32px}.contact-title{color:#d88a68;font-size:12px;font-weight:900}.contact p{margin:15px 0 0;color:var(--muted);font-size:12px;line-height:1.8}.contact-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:17px}.stat{padding:10px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.025)}.stat strong{display:block;color:var(--gold);font-size:16px}.stat span{color:var(--muted);font-size:9px}
        .market{min-width:0;border:1px solid var(--line);border-radius:6px;background:rgba(20,18,16,.9)}.market-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:20px;border-bottom:1px solid var(--line)}.market-head h2{margin:0;font-size:22px}.market-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.wallet{flex:0 0 auto;padding:10px 13px;border:1px solid var(--line);border-radius:4px;text-align:right}.wallet strong{display:block;color:var(--gold)}.wallet span{color:var(--muted);font-size:9px}.offer-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:12px}.offer{position:relative;min-width:0;min-height:190px;display:grid;grid-template-rows:auto 1fr auto;gap:9px;padding:12px;border:1px solid rgba(255,255,255,.1);border-radius:5px;background:#1b1916;overflow:hidden}.offer::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--quality,var(--common))}.offer.common{--quality:var(--common)}.offer.uncommon{--quality:var(--uncommon)}.offer.rare{--quality:var(--rare)}.offer.epic{--quality:var(--epic)}.offer.legendary{--quality:var(--legendary)}.offer.sold{opacity:.46;filter:grayscale(.55)}.slot-no{color:var(--muted);font:700 9px Georgia,serif}.offer-icon{align-self:center;text-align:center;font-size:36px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}.offer-name{min-width:0;overflow:hidden;color:var(--ink);font-size:12px;font-weight:900;text-overflow:ellipsis;white-space:nowrap}.offer-meta{display:flex;justify-content:space-between;gap:5px;margin-top:4px;color:var(--muted);font-size:9px}.offer-price{width:100%;min-height:36px;margin-top:9px;border:1px solid rgba(214,169,93,.32);border-radius:4px;color:#17110a;background:var(--gold);cursor:pointer;font-size:11px;font-weight:900}.offer-price:disabled{cursor:not-allowed;color:var(--muted);background:#282521}.quality-name{color:var(--quality)}.loading{grid-column:1/-1;padding:80px 20px;color:var(--muted);text-align:center}
        .overlay{position:fixed;z-index:80;inset:0;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}.overlay[hidden]{display:none}.dialog{width:min(430px,100%);padding:24px;border:1px solid var(--line);border-radius:6px;background:#171411;box-shadow:0 30px 100px rgba(0,0,0,.55)}.dialog-head{display:flex;align-items:center;gap:14px}.dialog-icon{width:65px;height:65px;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;font-size:32px;background:#211d19}.dialog h3{margin:0}.dialog p{color:var(--muted);line-height:1.7}.quality-name.common{color:var(--common)}.quality-name.uncommon{color:var(--uncommon)}.quality-name.rare{color:var(--rare)}.quality-name.epic{color:var(--epic)}.quality-name.legendary{color:var(--legendary)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.btn{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:#24201c;cursor:pointer;font-weight:900}.btn.primary{border-color:var(--gold);color:#1c140a;background:var(--gold)}.toast{position:fixed;z-index:100;left:50%;top:18px;transform:translateX(-50%);padding:11px 15px;border:1px solid var(--line);border-radius:4px;background:#211a15;box-shadow:0 12px 40px rgba(0,0,0,.45)}
        @media(max-width:1080px){.offer-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:760px){.page{width:min(100% - 18px,1380px);padding-top:8px}.topbar{align-items:flex-start;padding:10px}.brand span{display:none}.nav{flex:1;overflow-x:auto;flex-wrap:nowrap}.nav a{white-space:nowrap}.layout{grid-template-columns:1fr}.contact{position:relative;top:auto;display:grid;grid-template-columns:120px 1fr}.portrait{height:100%;min-height:190px}.portrait-initial{font-size:58px}.contact-copy{padding:16px}.contact-stats{display:none}.market-head{align-items:flex-start}.offer-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:8px}.offer{min-height:170px;padding:10px}.offer-icon{font-size:30px}}@media(max-width:390px){.offer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
        .contact-tabs{display:flex;gap:8px;margin-top:14px}.contact-tabs[hidden]{display:none!important}.contact-tab{min-height:42px;padding:0 18px;border:1px solid var(--line);border-radius:5px;color:var(--muted);background:#171513;cursor:pointer;font-weight:900}.contact-tab.active{border-color:var(--gold);color:#17110a;background:var(--gold)}.offer.equipped{box-shadow:inset 0 0 0 2px #d6a95d,0 12px 32px rgba(214,169,93,.12)}.offer.equipped .offer-price{color:#f5e8cd;background:#5b3f1b}
    </style>
</head>
<body>
<main class="page">
    <header class="topbar"><a class="brand" href="index.html"><img src="logo.png" alt=""><span>旅途传说 · 联络人网络</span></a><nav class="nav"><a href="bagdemo.html">背包</a><a href="wishing.html">许愿井</a><a href="contacts.html">联络人</a><a href="market.html">市场</a><a href="lottery.html">抽奖</a></nav></header>
    <div class="contact-tabs"><button class="contact-tab active" type="button" data-contact="keyi">可翼 · 良心商人</button><button class="contact-tab" type="button" data-contact="hotdog">阿尔法 · 地牢物资</button><button class="contact-tab" type="button" data-contact="jack">杰克 · 军火商</button><button class="contact-tab" type="button" data-contact="george">乔治 · 特效收藏家</button></div>
    <div class="contact-tabs" id="alphaModes" hidden><button class="contact-tab active" type="button" data-mode="buy">以物换物</button><button class="contact-tab" type="button" data-mode="sell">出售 [D] 物品</button></div>
    <div class="layout">
        <aside class="contact"><div class="portrait" id="contactAvatar"><span class="portrait-initial">翼</span></div><div class="contact-copy"><span class="contact-kicker" id="contactKicker">CONTACT / 01</span><h1 id="contactName">可翼</h1><span class="contact-title" id="contactTitle">良心商人</span><p id="contactDescription">货单正在加密传输。</p><div class="contact-stats"><div class="stat"><strong id="offerCount">30</strong><span>每日货位</span></div><div class="stat"><strong id="boughtCount">—</strong><span>今日已购</span></div></div></div></aside>
        <section class="market"><header class="market-head"><div><h2 id="marketTitle">今日隐秘货单</h2><p id="refreshText">每天零点刷新 · 每个货位限购 1 次</p><button class="btn" id="refreshKeyi" type="button">手动刷新可翼货单（今日剩余 3 次）</button><button class="btn" id="unequipEffect" type="button" hidden>卸下当前特效</button></div><div class="wallet"><strong id="goldText">—</strong><span id="walletLabel">当前金币</span></div></header><div class="offer-grid" id="offerGrid"><div class="loading">正在接入可翼的加密频道...</div></div></section>
    </div>
</main>
<section class="overlay" id="buyOverlay" hidden><div class="dialog"><div class="dialog-head"><div class="dialog-icon" id="dialogIcon">◇</div><div><h3 id="dialogName">确认购买</h3><span class="quality-name" id="dialogQuality"></span></div></div><p id="dialogCopy"></p><div class="actions"><button class="btn" id="cancelBuy" type="button">再想想</button><button class="btn primary" id="confirmBuy" type="button">确认交易</button></div></div></section>
<div id="toastRegion" aria-live="polite"></div>
<script>
const contactModeKey='journey-contact-mode';
const originalContactFetch=window.fetch.bind(window);
window.fetch=(input,init)=>{const url=String(input);if(url.includes('board.php?')&&url.includes('action=getContactMarket')&&url.includes('contactId=hotdog')){const next=new URL(url,location.href);next.searchParams.set('mode',localStorage.getItem(contactModeKey)||'buy');return originalContactFetch(next.toString(),init)}return originalContactFetch(input,init)};
document.addEventListener('click',event=>{const modeButton=event.target.closest('[data-mode]');if(modeButton){localStorage.setItem(contactModeKey,modeButton.dataset.mode);localStorage.setItem('journey-contact-id','hotdog');location.reload();return}const contactButton=event.target.closest('[data-contact]');if(contactButton){const id=contactButton.dataset.contact;localStorage.setItem('journey-contact-id',id);const alpha=id==='hotdog',keyi=id==='keyi';document.getElementById('alphaModes').hidden=!alpha;document.getElementById('refreshKeyi').hidden=!keyi;document.getElementById('unequipEffect').hidden=id!=='george';if(!alpha)localStorage.setItem(contactModeKey,'buy')}});
document.addEventListener('click',async event=>{if(!event.target.closest('#unequipEffect'))return;const button=document.getElementById('unequipEffect');button.disabled=true;try{const csrf=decodeURIComponent((document.cookie.match(/(?:^|; )journey_csrf=([^;]*)/)||[,''])[1]);const response=await fetch('board.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams({action:'unequipGeorgeEffect',_csrf:csrf})});const result=await response.json();if(result.code==='ok'){alert('当前特效已卸下。');location.reload()}else alert('卸下失败，请稍后重试。')}catch(error){alert('无法连接服务器。')}finally{button.disabled=false}});
async function syncJackWallet(){const tab=document.querySelector('[data-contact="jack"].active');if(!tab)return;try{const response=await fetch('board.php?action=getContactMarket&contactId=jack',{cache:'no-store'});const result=await response.json();if(result.code==='ok'){document.getElementById('goldText').textContent=Number(result.wingCoins||0).toLocaleString('zh-CN');document.getElementById('walletLabel').textContent='当前翼币'}}catch(error){}}
async function syncAlphaSellWallet(){if((localStorage.getItem('journey-contact-id')||'keyi')!=='hotdog'||(localStorage.getItem(contactModeKey)||'buy')!=='sell')return;try{const response=await fetch('board.php?action=getContactMarket&contactId=hotdog',{cache:'no-store'});const result=await response.json();if(result.code==='ok'){document.getElementById('goldText').textContent=Number(result.wingCoins||0).toLocaleString('zh-CN');document.getElementById('walletLabel').textContent='当前翼币'}}catch(error){}}
document.addEventListener('click',event=>{if(event.target.closest('[data-contact="jack"]'))setTimeout(syncJackWallet,120)});
document.addEventListener('click',async event=>{const button=event.target.closest('#offerGrid .offer-price');if(!button||localStorage.getItem(contactModeKey)!=='sell')return;event.preventDefault();event.stopImmediatePropagation();const card=button.closest('.offer'),slot=Number(card?.querySelector('.slot-no')?.textContent?.replace(/\D/g,''))-1;if(!Number.isInteger(slot)||slot<0)return;if(!confirm('确定出售这件 [D] 物品吗？'))return;button.disabled=true;const response=await fetch('board.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:`action=sellContactItem&slot=${slot}`});const result=await response.json();if(result.code==='ok')location.reload();else{alert(result.code==='not_sellable'?'这件物品不能出售。':'出售失败，请稍后重试。');button.disabled=false}},true);
document.addEventListener('click',async event=>{const button=event.target.closest('#refreshKeyi');if(!button)return;if(!confirm('确定消耗 1 次今日刷新机会，重新生成可翼货单吗？'))return;button.disabled=true;try{const response=await fetch('board.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'action=refreshKeyiMarket'});const result=await response.json();if(result.code!=='ok'){alert(result.code==='refresh_limit'?'今日可翼刷新次数已用完。':'刷新失败，请稍后重试。');button.disabled=false;return}location.reload()}catch(error){alert('无法连接服务器，请稍后重试。');button.disabled=false}});
async function syncKeyiRefreshText(){const button=document.getElementById('refreshKeyi');if(!button)return;try{const response=await fetch('board.php?action=getContactMarket&contactId=keyi',{cache:'no-store'});const result=await response.json();if(result.code==='ok'&&Number.isFinite(Number(result.refreshLeft))){const left=Math.max(0,Number(result.refreshLeft));button.textContent=`手动刷新可翼货单（今日剩余 ${left} 次）`;button.disabled=left<=0}}catch(error){}}
syncKeyiRefreshText();
window.setTimeout(syncAlphaSellWallet,120);
window.setTimeout(syncAlphaSellWallet,650);
window.setTimeout(syncJackWallet,650);
const savedContactId=localStorage.getItem('journey-contact-id')||'keyi';
document.getElementById('alphaModes').hidden=savedContactId!=='hotdog';document.getElementById('refreshKeyi').hidden=savedContactId!=='keyi';
document.getElementById('unequipEffect').hidden=savedContactId!=='george';
const savedContactMode=localStorage.getItem(contactModeKey)||'buy';
document.querySelectorAll('[data-mode]').forEach(button=>button.classList.toggle('active',button.dataset.mode===savedContactMode));
const fixedPriceObserver=new MutationObserver(()=>{const selling=localStorage.getItem(contactModeKey)==='sell';document.querySelectorAll('#offerGrid .offer-meta span').forEach(node=>{if(node.textContent.includes('低于均价'))node.textContent='固定报价'});document.querySelectorAll('#offerGrid .offer').forEach(card=>{const name=card.querySelector('.offer-name')?.textContent||'',button=card.querySelector('.offer-price');if(!button)return;if(name==='空格'){if(!button.disabled)button.disabled=true;if(button.textContent!=='空')button.textContent='空'}else if(selling&&!button.disabled){const price=Number(String(button.textContent).replace(/[^0-9]/g,''))||0;const label=`出售 · ${price} 翼币`;if(button.textContent!==label)button.textContent=label}})});
fixedPriceObserver.observe(document.getElementById('offerGrid'),{childList:true,subtree:true});
const jackCurrencyObserver=new MutationObserver(()=>{
    if((localStorage.getItem('journey-contact-id')||'keyi')!=='jack')return;
    document.querySelectorAll('#offerGrid .offer-price').forEach(button=>{
        if(button.textContent.includes('金币'))button.textContent=button.textContent.replace(/金币/g,'翼币');
    });
    const walletLabel=document.getElementById('walletLabel');
    if(walletLabel)walletLabel.textContent='当前翼币';
});
jackCurrencyObserver.observe(document.getElementById('offerGrid'),{childList:true,subtree:true,characterData:true});
document.addEventListener('click',event=>{
    if((localStorage.getItem('journey-contact-id')||'keyi')!=='jack')return;
    if(event.target.closest('#offerGrid .offer-price'))setTimeout(()=>{
        const copy=document.getElementById('dialogCopy');
        if(copy)copy.textContent=copy.textContent.replace(/金币/g,'翼币');
    },0);
});
(()=>{'use strict';
const $=id=>document.getElementById(id);const qualityNames={common:'普通',uncommon:'精良',rare:'稀有',epic:'史诗',legendary:'传说'};let data=null,selected=null,busy=false,contactId=localStorage.getItem('journey-contact-id')||'keyi';
function toast(message){const node=document.createElement('div');node.className='toast';node.textContent=message;$('toastRegion').append(node);setTimeout(()=>node.remove(),3200)}
async function api(action,{method='GET',data={}}={}){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),5000);try{let url=`board.php?${new URLSearchParams(Object.assign({action},data))}`;const init={method,cache:'no-store',signal:controller.signal};if(method==='POST'){init.body=new URLSearchParams(Object.assign({action},data));init.headers={'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'};url='board.php'}const response=await fetch(url,init);const payload=await response.json().catch(()=>({code:'invalid_response'}));return payload}finally{clearTimeout(timer)}}
function renderAvatar(avatar){const box=$('contactAvatar');box.replaceChildren();if(avatar&&avatar.type==='image'&&avatar.src){const img=document.createElement('img');img.src=avatar.src;img.alt=`${data?.contact?.name||'联络人'}头像`;box.append(img)}else{const initial=document.createElement('span');initial.className='portrait-initial';initial.textContent=avatar&&avatar.text?avatar.text:'翼';box.append(initial)}}
function offerCard(offer){const barter=data.transactionType==='barter',effect=data.transactionType==='effect';const card=document.createElement('article');card.className=`offer ${offer.quality||'common'}${!effect&&offer.purchased?' sold':''}${offer.equipped?' equipped':''}`;const top=document.createElement('span');top.className='slot-no';top.textContent=effect?'EFFECT':`SLOT ${String(Number(offer.slot)+1).padStart(2,'0')}`;const icon=document.createElement('div');icon.className='offer-icon';icon.textContent=offer.item.icon||'◇';const info=document.createElement('div');const name=document.createElement('div');name.className='offer-name';name.title=offer.item.name;name.textContent=offer.item.name;const meta=document.createElement('div');meta.className='offer-meta';const quality=document.createElement('span');quality.className='quality-name';quality.textContent=effect?'地牢特效':qualityNames[offer.quality]||offer.quality;const detail=document.createElement('span');detail.textContent=effect?(offer.equipped?'当前装备':offer.purchased?'已经拥有':'永久解锁'):barter?`持有 ${offer.ownedMaterialCount||0}`:(offer.hotdogMaterial?'热狗材料':`低于均价 ${offer.discount}%`);meta.append(quality,detail);const button=document.createElement('button');button.type='button';button.className='offer-price';button.disabled=offer.equipped||(!effect&&offer.purchased)||(barter&&Number(offer.ownedMaterialCount||0)<Number(offer.materialCount||1));button.textContent=effect?(offer.equipped?'已装备':offer.purchased?'立即装备':`${Number(offer.price).toLocaleString('zh-CN')} 翼币`):offer.purchased?'今日已兑':barter?`用 ${offer.material.name} ×${offer.materialCount} 兑换`:`${Number(offer.price).toLocaleString('zh-CN')} 金币`;button.addEventListener('click',()=>openBuy(offer));info.append(name,meta,button);card.append(top,icon,info);return card}
function render(){if(!data)return;const effect=data.transactionType==='effect';renderAvatar(data.contact.avatar);$('contactName').textContent=data.contact.name;$('contactTitle').textContent=data.contact.title;$('contactDescription').textContent=data.contact.description;$('contactKicker').textContent=`CONTACT / ${contactId==='george'?'03':contactId==='hotdog'?'02':'01'}`;$('offerCount').textContent=String(data.offers.length);$('boughtCount').textContent=String(data.purchasedCount||0);$('goldText').textContent=effect?Number(data.wingCoins||0).toLocaleString('zh-CN'):data.unlimitedGold?'∞':Number(data.gold||0).toLocaleString('zh-CN');$('walletLabel').textContent=effect?'当前翼币':'当前金币';$('marketTitle').textContent=effect?'永久特效收藏':'今日隐秘货单';$('refreshText').textContent=effect?'购买后永久拥有，点击已拥有的特效即可直接装备':`${data.date} 货单 · 每天零点刷新 · 每格限${data.transactionType==='barter'?'兑':'购'} 1 次`;document.querySelectorAll('[data-contact]').forEach(button=>button.classList.toggle('active',button.dataset.contact===contactId));const grid=$('offerGrid');grid.replaceChildren();data.offers.forEach(offer=>grid.append(offerCard(offer)))}
function openBuy(offer){if(offer.equipped||busy||(data.transactionType!=='effect'&&offer.purchased))return;selected=offer;const effect=data.transactionType==='effect';$('dialogIcon').textContent=offer.item.icon||'◇';$('dialogName').textContent=offer.item.name;$('dialogQuality').className=`quality-name ${offer.quality}`;$('dialogQuality').textContent=effect?'地牢特效':qualityNames[offer.quality]||offer.quality;$('dialogCopy').textContent=effect?(offer.purchased?`确认立即装备「${offer.item.name}」吗？进入黑暗地牢后会自动生效。`:`乔治售价 ${Number(offer.price).toLocaleString('zh-CN')} 翼币。购买后永久拥有并立即装备，确认购买吗？`):data.transactionType==='barter'?`交给热狗「${offer.material.name}」×${offer.materialCount}，兑换同品质的「${offer.item.name}」。材料会优先从官网背包扣除，不足时再从官网仓库扣除。确认兑换吗？`:`可翼报价 ${Number(offer.price).toLocaleString('zh-CN')} 金币，低于该品质今日参考均价 ${offer.discount}%。${offer.hotdogMaterial?'这件物品是热狗今日可能需要的兑换材料。':''}${offer.item.recyclable===false?'这是可带入黑暗地牢使用的 [D] 物品，无法通过系统回收。':''}确认购买吗？`;$('buyOverlay').hidden=false}
async function buy(){if(!selected||busy)return;busy=true;$('confirmBuy').disabled=true;$('confirmBuy').textContent='正在交易...';try{const effect=data.transactionType==='effect';const action=effect?(selected.purchased?'equipGeorgeEffect':'buyGeorgeEffect'):'buyContactOffer';const result=await api(action,{method:'POST',data:effect?{effectId:selected.effectId}:{offerId:selected.offerId,contactId}});const messages={already_purchased:'这个货位今天已经交易过',not_enough_gold:'金币不足',not_enough_wing_coins:'翼币不足',material_missing:'兑换材料不足或已经被使用',offer_not_found:'今日货单已经刷新',rate_limited:'操作太快，请稍后重试'};if(result.code!=='ok')return toast(messages[result.code]||'交易失败，请稍后重试');$('buyOverlay').hidden=true;toast(effect?`已装备「${selected.item.name}」`:`${contactId==='hotdog'?'已兑换':'已购买'}「${result.item.name}」${result.delivery==='mail'?'，物品已进入邮件':''}`);await load()}catch(error){toast('无法连接联络人，请稍后重试')}finally{busy=false;$('confirmBuy').disabled=false;$('confirmBuy').textContent='确认交易'}}
async function load(){const result=await api(contactId==='george'?'getGeorgeEffects':'getContactMarket',{data:contactId==='george'?{}:{contactId}});if(result.code!=='ok')throw new Error(result.code);data=result;render()}
$('cancelBuy').addEventListener('click',()=>{$('buyOverlay').hidden=true;selected=null});$('confirmBuy').addEventListener('click',buy);document.querySelectorAll('[data-contact]').forEach(button=>button.addEventListener('click',()=>{if(busy||button.dataset.contact===contactId)return;contactId=button.dataset.contact;selected=null;$('offerGrid').innerHTML='<div class="loading">正在连接联络人频道...</div>';load().catch(()=>toast('联络人货单读取失败'))}));$('buyOverlay').addEventListener('click',event=>{if(event.target===$('buyOverlay'))$('buyOverlay').hidden=true});window.addEventListener('keydown',event=>{if(event.key==='Escape')$('buyOverlay').hidden=true});
(async()=>{const auth=await JourneyAuth.ready;if(!auth||!auth.authenticated){location.href='auth.html?next=contacts.html';return}load().catch(()=>toast('联络人货单读取失败'))})();
})();
</script>
</body>
</html>
